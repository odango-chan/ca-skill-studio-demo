procedures:
  ue-requested-pdu-session-establishment:
    applicability:
      predicates:
        createdsession.ingress.eligible: PASS
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      dnn:
        type: string
        from: context.request.dnn
      slice:
        type: object
        from: context.request.sNssai
      plmn:
        type: object
        from: context.request.servingPlmn
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
      requested-type:
        type: string
        from: context.request.requestedPduSessionType
      requested-ssc:
        type: integer
        from: context.request.requestedSscMode

    start: nudm-sdm-get

    nodes:
      nudm-sdm-get:
        call: sbi.udm.sm_data.get
        with:
          ueRef:
            from: input.ue-ref
          dnn:
            from: input.dnn
          sNssai:
            from: input.slice
          servingPlmn:
            from: input.plmn
        postconditions:
          steps:
            - verify: createdsession.udm.subscription_usable
              with:
                udmReadReceipt:
                  from: nudm-sdm-get.output
          'on':
            PASS: nudm-sdm-subscribe
            FAIL: failed
            UNKNOWN: unresolved
        'on':
          FAILED: failed
          DENIED: failed
          UNKNOWN: unresolved

      nudm-sdm-subscribe:
        preconditions:
          steps:
            # Shared procedure data, consumed later by PCF Create and AMF delivery
            # preparation.
            - name: select-subscription-configuration
              script: scripts/select_establishment_configuration.py
              with:
                dnn:
                  from: input.dnn
                sNssai:
                  from: input.slice
                requestedPduSessionType:
                  from: input.requested-type
                requestedSscMode:
                  from: input.requested-ssc
                udmResult:
                  from: nudm-sdm-get.output.result

            # PCF Create input readiness is its own owner read. The
            # operation-context `policy-create` purpose stays UNAVAILABLE because
            # a read cannot prove ownership of an association that does not
            # exist yet, so it must not gate the create.
            - name: resolve-pcf-create-inputs
              call: ca.session.pcf_create_inputs.read
              with:
                ueRef:
                  from: input.ue-ref
                pduSessionId:
                  from: input.psi
                pti:
                  from: input.pti
                requestType:
                  from: input.request-type
                ingressRef:
                  from: input.ingress-ref
                lifecycleRef:
                  from: input.lifecycle-ref
                selection:
                  from: preconditions.select-subscription-configuration.output

            - verify: createdsession.pcf.create_inputs.ready
              with:
                pcfCreateInputsRef:
                  from: preconditions.resolve-pcf-create-inputs.output.pcfCreateInputsRef
                runtimeInvocationRef:
                  from: preconditions.resolve-pcf-create-inputs.output.runtimeInvocationRef
            - verify: createdsession.ingress.eligible
            - verify: createdsession.lifecycle.ready
          'on':
            FAILED: failed
            UNRESOLVED: unresolved

        call: sbi.udm.sdm_subscription.create
        with:
          # UDM Subscribe consumes the PCF create *inputs* handle as the
          # Provider-bound evidence for this attempt: exact lifecycle,
          # invocation and ingress evidence must match, and the Provider
          # selection digest must equal the Runtime's recomputation over this
          # governed selection. It is not an operation context and never
          # represents association ownership. The Provider SMF-builder
          # comparison covers DNN/SST/SD only; PDU Session Type and SSC Mode are
          # checked against the governed UE request and matched subscription.
          pcfCreateInputsRef:
            from: preconditions.resolve-pcf-create-inputs.output.pcfCreateInputsRef
          pcfCreateInputsInvocationRef:
            from: preconditions.resolve-pcf-create-inputs.output.runtimeInvocationRef
          selection:
            from: preconditions.select-subscription-configuration.output
          ingressRef:
            from: input.ingress-ref
          lifecycleRef:
            from: input.lifecycle-ref
        postconditions:
          steps:
            - verify: createdsession.udm.subscription_owned
          'on':
            PASS: npcf-sm-policy-control-create
            FAIL: finalize-failed
            UNKNOWN: finalize-unresolved
        'on':
          NOT_COMMITTED: finalize-failed
          OUTCOME_UNKNOWN: reconcile-nudm-sdm-subscribe
          FAILED: finalize-failed
          DENIED: finalize-failed

      npcf-sm-policy-control-create:
        preconditions:
          steps:
            # Input readiness above is necessary, not sufficient. A create also
            # needs a clean resource lifecycle and proof that the original SMF's
            # competing create was not forwarded. No admitted owner supplies that
            # evidence yet, so this gate stays UNRESOLVED and blocks the create
            # instead of being replaced by a locally invented ownership claim.
            - verify: createdsession.pcf.create_governed
              with:
                lifecycleRef:
                  from: input.lifecycle-ref
                ingressRef:
                  from: input.ingress-ref
            - verify: createdsession.lifecycle.ready
          'on':
            FAILED: finalize-failed
            UNRESOLVED: finalize-unresolved

        call: sbi.pcf.sm_policy.create
        with:
          pcfCreateInputsRef:
            from: nudm-sdm-subscribe.preconditions.resolve-pcf-create-inputs.output.pcfCreateInputsRef
          selection:
            from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
          lifecycleRef:
            from: input.lifecycle-ref
          sdmSubscriptionRef:
            from: nudm-sdm-subscribe.output.subscriptionRef
        postconditions:
          steps:
            - verify: createdsession.pcf.association_owned
          'on':
            PASS: n4-session-establishment
            FAIL: finalize-failed
            UNKNOWN: finalize-unresolved
        'on':
          NOT_COMMITTED: finalize-failed
          OUTCOME_UNKNOWN: reconcile-npcf-sm-policy-control-create
          FAILED: finalize-failed
          DENIED: finalize-failed

      n4-session-establishment:
        procedure: await-initial-n4-session-establishment
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          # The N4 wait is joined to the exact current SMF/UPF session instance
          # value from the PCF create input read. It deliberately does NOT use
          # the PCF create inputs handle: that handle expires in five seconds
          # and is a PCF-create consumer, not an operation context or an N4
          # correlation handle.
          session-instance-ref:
            from: nudm-sdm-subscribe.preconditions.resolve-pcf-create-inputs.output.currentSessionInstanceRef
          lifecycle-ref:
            from: input.lifecycle-ref
        'on':
          SUCCEEDED: namf-communication-n1n2-message-transfer
          FAILED: finalize-failed
          UNRESOLVED: finalize-unresolved

      namf-communication-n1n2-message-transfer:
        preconditions:
          steps:
            # Shared procedure data, reused by AMF transfer and downstream
            # RAN/N4/UE convergence.
            - name: resolve-effective-session-configuration
              call: ca.session.operation_context.read
              with:
                ueRef:
                  from: input.ue-ref
                pduSessionId:
                  from: input.psi
                pti:
                  from: input.pti
                requestType:
                  from: input.request-type
                ingressRef:
                  from: input.ingress-ref
                lifecycleRef:
                  from: input.lifecycle-ref
                selection:
                  from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
                policyResultRef:
                  from: npcf-sm-policy-control-create.output.policyResultRef
                purpose:
                  value: nas-and-n2-delivery

            - verify: createdsession.delivery_context.ready
              with:
                operationContextRef:
                  from: preconditions.resolve-effective-session-configuration.output.contextRef
                runtimeInvocationRef:
                  from: preconditions.resolve-effective-session-configuration.output.runtimeInvocationRef

            - name: prepare-establishment-response
              call: ca.session.establishment_response.prepare
              with:
                operationContextRef:
                  from: preconditions.resolve-effective-session-configuration.output.contextRef
                runtimeInvocationRef:
                  from: preconditions.resolve-effective-session-configuration.output.runtimeInvocationRef
                pduSessionId:
                  from: input.psi
                pti:
                  from: input.pti
                selection:
                  from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
                policyResultRef:
                  from: npcf-sm-policy-control-create.output.policyResultRef

          'on':
            FAILED: finalize-failed
            UNRESOLVED: finalize-unresolved

        call: sbi.amf.n1n2.transfer
        with:
          operationContextRef:
            from: preconditions.resolve-effective-session-configuration.output.contextRef
          runtimeInvocationRef:
            from: preconditions.resolve-effective-session-configuration.output.runtimeInvocationRef
          lifecycleRef:
            from: input.lifecycle-ref
          responseArtifactRef:
            from: preconditions.prepare-establishment-response.output.responseArtifactRef
        postconditions:
          steps:
            - verify: createdsession.amf.transfer_initiated
              with:
                amfTransferOperationRef:
                  from: namf-communication-n1n2-message-transfer.output.operationRef
          'on':
            PASS: pdu-session-resource-setup
            FAIL: finalize-failed
            UNKNOWN: finalize-unresolved
        'on':
          NOT_COMMITTED: finalize-failed
          OUTCOME_UNKNOWN: reconcile-n1n2-message-transfer
          FAILED: finalize-failed
          DENIED: finalize-failed

      pdu-session-resource-setup:
        procedure: await-pdu-session-resource-setup
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          operation-context-ref:
            from: namf-communication-n1n2-message-transfer.preconditions.resolve-effective-session-configuration.output.contextRef
          after-operation-ref:
            from: namf-communication-n1n2-message-transfer.output.operationRef
          lifecycle-ref:
            from: input.lifecycle-ref
        'on':
          SUCCEEDED: n4-session-modification
          FAILED: finalize-failed
          UNRESOLVED: finalize-unresolved

      n4-session-modification:
        procedure: await-n4-forwarding-convergence
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          operation-context-ref:
            from: namf-communication-n1n2-message-transfer.preconditions.resolve-effective-session-configuration.output.contextRef
          after-operation-ref:
            from: namf-communication-n1n2-message-transfer.output.operationRef
          lifecycle-ref:
            from: input.lifecycle-ref
        'on':
          SUCCEEDED: finalize-success
          FAILED: finalize-failed
          UNRESOLVED: finalize-unresolved

      finalize-success:
        preconditions:
          steps:
            - name: await-ue-session-configuration
              procedure: await-ue-session-configuration
              with:
                ue-ref:
                  from: input.ue-ref
                psi:
                  from: input.psi
                pti:
                  from: input.pti
                request-type:
                  from: input.request-type
                ingress-ref:
                  from: input.ingress-ref
                operation-context-ref:
                  from: namf-communication-n1n2-message-transfer.preconditions.resolve-effective-session-configuration.output.contextRef
                after-operation-ref:
                  from: namf-communication-n1n2-message-transfer.output.operationRef
                lifecycle-ref:
                  from: input.lifecycle-ref
          'on':
            FAILED: finalize-failed
            UNRESOLVED: finalize-unresolved

        procedure: finalize-resource-responsibility
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          lifecycle-ref:
            from: input.lifecycle-ref
          disposition:
            value: success
        'on':
          SUCCEEDED: done
          FAILED: safe-stopped
          UNRESOLVED: unresolved
          SAFE_STOPPED: safe-stopped

      finalize-failed:
        procedure: finalize-resource-responsibility
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          lifecycle-ref:
            from: input.lifecycle-ref
          disposition:
            value: failed
        'on':
          SUCCEEDED: failed
          FAILED: safe-stopped
          UNRESOLVED: unresolved
          SAFE_STOPPED: safe-stopped

      finalize-unresolved:
        procedure: finalize-resource-responsibility
        with:
          ue-ref:
            from: input.ue-ref
          psi:
            from: input.psi
          pti:
            from: input.pti
          request-type:
            from: input.request-type
          ingress-ref:
            from: input.ingress-ref
          lifecycle-ref:
            from: input.lifecycle-ref
          disposition:
            value: unresolved
        'on':
          SUCCEEDED: unresolved
          FAILED: safe-stopped
          UNRESOLVED: unresolved
          SAFE_STOPPED: safe-stopped

      reconcile-nudm-sdm-subscribe:
        reconcile: nudm-sdm-subscribe
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: safe-stopped

      reconcile-npcf-sm-policy-control-create:
        reconcile: npcf-sm-policy-control-create
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: safe-stopped

      reconcile-n1n2-message-transfer:
        reconcile: namf-communication-n1n2-message-transfer
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: safe-stopped

      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED

  await-initial-n4-session-establishment:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      session-instance-ref:
        type: string
        from: context.subject.sessionInstanceRef
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
    start: await-initial-resources
    nodes:
      await-initial-resources:
        call: ca.session.evidence.await
        with:
          sessionInstanceRef:
            from: input.session-instance-ref
          lifecycleRef:
            from: input.lifecycle-ref
          purpose:
            value: n4-session-establishment
        postconditions:
          steps:
            - verify: createdsession.n4.initial_resources_ready
          'on':
            PASS: done
            FAIL: failed
            UNKNOWN: unresolved
        'on':
          FAILED: unresolved
          UNKNOWN: unresolved
          DENIED: failed
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED

  await-pdu-session-resource-setup:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      operation-context-ref:
        type: string
        from: context.subject.operationContextRef
      after-operation-ref:
        type: string
        from: context.subject.afterOperationRef
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
    start: await-ran-result
    nodes:
      await-ran-result:
        call: ca.session.evidence.await
        with:
          operationContextRef:
            from: input.operation-context-ref
          afterOperationRef:
            from: input.after-operation-ref
          lifecycleRef:
            from: input.lifecycle-ref
          purpose:
            value: ran-setup-result
        postconditions:
          steps:
            - verify: createdsession.ran.setup_accepted
          'on':
            PASS: done
            FAIL: failed
            UNKNOWN: unresolved
        'on':
          FAILED: unresolved
          UNKNOWN: unresolved
          DENIED: failed
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED

  await-n4-forwarding-convergence:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      operation-context-ref:
        type: string
        from: context.subject.operationContextRef
      after-operation-ref:
        type: string
        from: context.subject.afterOperationRef
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
    start: await-forwarding
    nodes:
      await-forwarding:
        call: ca.session.evidence.await
        with:
          operationContextRef:
            from: input.operation-context-ref
          afterOperationRef:
            from: input.after-operation-ref
          lifecycleRef:
            from: input.lifecycle-ref
          purpose:
            value: n4-forwarding
        postconditions:
          steps:
            - verify: createdsession.n4.forwarding_ready
          'on':
            PASS: done
            FAIL: failed
            UNKNOWN: unresolved
        'on':
          FAILED: unresolved
          UNKNOWN: unresolved
          DENIED: failed
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED

  await-ue-session-configuration:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      operation-context-ref:
        type: string
        from: context.subject.operationContextRef
      after-operation-ref:
        type: string
        from: context.subject.afterOperationRef
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
    start: await-ue
    nodes:
      await-ue:
        call: ca.session.evidence.await
        with:
          operationContextRef:
            from: input.operation-context-ref
          afterOperationRef:
            from: input.after-operation-ref
          lifecycleRef:
            from: input.lifecycle-ref
          purpose:
            value: ue-configuration
        postconditions:
          steps:
            - verify: createdsession.ue.configuration_accepted
          'on':
            PASS: done
            FAIL: failed
            UNKNOWN: unresolved
        'on':
          FAILED: unresolved
          UNKNOWN: unresolved
          DENIED: failed
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED

  finalize-resource-responsibility:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      psi:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      request-type:
        type: integer
        from: context.request.requestType
      ingress-ref:
        type: string
        from: context.facts.createdsession_ingress
      lifecycle-ref:
        type: string
        from: context.facts.createdsession_lifecycle
      disposition:
        type: string
        from: context.subject.resourceDisposition
    start: transfer
    nodes:
      transfer:
        call: ca.session.resource_responsibility.transfer
        with:
          lifecycleRef:
            from: input.lifecycle-ref
          disposition:
            from: input.disposition
        postconditions:
          steps:
            - verify: createdsession.resources.managed
          'on':
            PASS: done
            FAIL: safe-stopped
            UNKNOWN: unresolved
        'on':
          NOT_COMMITTED: safe-stopped
          OUTCOME_UNKNOWN: reconcile-transfer
          FAILED: safe-stopped
          DENIED: safe-stopped

      reconcile-transfer:
        reconcile: transfer
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: safe-stopped

      done:
        terminal: SUCCEEDED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
