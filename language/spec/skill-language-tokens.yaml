apiVersion: connectionagent.io/language/v0alpha1
kind: SemanticTokenCatalog
metadata:
  name: ca-skill-language
  version: 0.1.0
  status: draft
spec:
  languageSpecification: docs/skill-language-spec.md
  purpose: >
    Stable semantic token identifiers and source-position selectors shared by
    Skill Studio, the target Compiler and future LSP implementations.
  selectorSyntax:
    sourceFile: Repository-relative glob identifying an authoring file.
    yamlPath: >
      Dot-separated path through a parsed YAML document. A segment "*" matches
      one map key; "[*]" matches array items. Selectors describe semantic
      positions, not raw text search patterns.
    mapKey: When true, the selected path segment is a symbol definition key.
    scalarValue: When true, the selected node's scalar value is classified.
    frontmatterField: Field name in SKILL.md YAML frontmatter.
  tokens:
    - id: ca.document.kind
      status: current
      description: Value of the top-level YAML document kind.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.kind"
          scalarValue: true
        - sourceFile: "skills/*/assurance/predicates.yaml"
          yamlPath: "$.kind"
          scalarValue: true
        - sourceFile: "skills/*/cases/*/case.yaml"
          yamlPath: "$.kind"
          scalarValue: true
        - sourceFile: "lib/**/*.yaml"
          yamlPath: "$.kind"
          scalarValue: true
    - id: ca.document.version
      status: current
      description: Value of apiVersion in a CA source document.
      selectors:
        - sourceFile: "skills/**/*.yaml"
          yamlPath: "$.apiVersion"
          scalarValue: true
        - sourceFile: "lib/**/*.yaml"
          yamlPath: "$.apiVersion"
          scalarValue: true
    - id: ca.keyword.structure
      status: current
      description: CA structural keys in their artifact-specific positions.
      contexts:
        - SkillContract: "spec, metadata, inputs, context, requiredFacts, allowedResources, capabilities, localTools, preconditions, requirements, postconditions, planning, maxActions, allowDynamicProcedure, failureSemantics, outcomeUnknown, requireReconcile"
        - Procedure: "procedures, applicability, predicates, inputs, type, start, nodes"
        - PredicateSet: "predicates, observations, ref, scope, freshness, evaluator, expression"
        - SkillTestCase: "metadata, spec, classes, purpose, context, subject, request, facts, availableResources, expect, fixtures"
        - ToolCatalog: "spec, contracts, operation, adapter, effect, inputSchema, outputSchema"
        - CapabilityContracts: "spec, capabilities, capability, owner, operations, operation, effect, budgetExemptOperations"
      note: Context names are not a global reserved-word list; classify only in the corresponding document position.
    - id: ca.keyword.control
      status: current
      description: Procedure node-intent keys.
      lexemes:
        - value: call
          status: current
        - value: verify
          status: current
        - value: script
          status: current
        - value: reconcile
          status: current
        - value: terminal
          status: current
        - value: tool
          status: documented-unverified
        - value: procedure
          status: documented-unverified
        - value: for
          status: documented-unverified
      note: The last three forms are documented by earlier authoring guidance but are not used by the two current 5GC source packages.
    - id: ca.keyword.condition
      status: current
      description: Condition, phase and result-routing keys.
      lexemes:
        - value: applicability
          status: current
        - value: preconditions
          status: current
        - value: postconditions
          status: current
        - value: steps
          status: current
        - value: "on"
          status: current
        - value: when
          status: documented-not-frozen
      note: Current conventional source uses applicability.predicates; applicability.when is not frozen by v0.
    - id: ca.keyword.binding
      status: current
      description: Explicit Procedure binding keys.
      lexemes:
        - value: with
          status: current
        - value: from
          status: current
        - value: value
          status: current
    - id: ca.symbol.skill-definition
      status: current
      description: Skill identity declared in SKILL.md frontmatter.
      selectors:
        - sourceFile: "skills/*/SKILL.md"
          frontmatterField: name
          scalarValue: true
    - id: ca.symbol.procedure-definition
      status: current
      description: Procedure ID declared as a map key.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*"
          mapKey: true
    - id: ca.symbol.node-definition
      status: current
      description: Procedure node ID declared as a map key.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*"
          mapKey: true
    - id: ca.symbol.predicate-definition
      status: current
      description: Predicate ID declared as a map key.
      selectors:
        - sourceFile: "skills/*/assurance/predicates.yaml"
          yamlPath: "$.predicates.*"
          mapKey: true
    - id: ca.symbol.case-definition
      status: current
      description: Qualification Case identity.
      selectors:
        - sourceFile: "skills/*/cases/*/case.yaml"
          yamlPath: "$.metadata.name"
          scalarValue: true
    - id: ca.symbol.local-tool-definition
      status: current
      description: Local Tool identity declared in a governed Script metadata block.
      selectors:
        - sourceFile: "skills/*/scripts/*.py"
          metadataField: name
          scalarValue: true
      note: The exact mapping between this metadata name and skill-prefixed localTools IDs is not frozen.
    - id: ca.symbol.capability-definition
      status: optional-import
      description: Capability identity declared by an imported deployment-owned CapabilityContracts snapshot.
      selectors:
        - sourceFile: "lib/capabilities/**/*.yaml"
          yamlPath: "$.spec.capabilities[*].capability"
          scalarValue: true
      note: No CapabilityContracts snapshot is imported by the current 5GC project.
    - id: ca.symbol.operation-definition
      status: current
      description: Operation identity declared by an imported ToolCatalog.
      selectors:
        - sourceFile: "lib/tools/**/*.yaml"
          yamlPath: "$.spec.contracts[*].operation"
          scalarValue: true
    - id: ca.reference.capability
      status: current
      description: Resource-grant reference in allowedResources.capabilities; target may be a Capability ID or a direct Operation ID.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.allowedResources.capabilities[*]"
          scalarValue: true
      note: Resolve exact Capability ID first when an imported CapabilityContracts snapshot exists; otherwise or on no match, try an exact ToolCatalog Operation ID as a direct grant.
    - id: ca.reference.operation
      status: current
      description: Exact Operation identity referenced by a Procedure call.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.call"
          scalarValue: true
    - id: ca.reference.predicate
      status: current
      description: Reference to a Predicate definition.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.preconditions[*].predicate"
          scalarValue: true
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.postconditions[*].predicate"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.verify"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.applicability.predicates.*"
          mapKey: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.preconditions.steps[*].verify"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.postconditions.steps[*].verify"
          scalarValue: true
    - id: ca.reference.procedure
      status: current
      description: Reference to another Procedure definition or Skill entry Procedure.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.entryProcedure"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.procedure"
          scalarValue: true
          supportStatus: documented-unverified
    - id: ca.reference.node
      status: current
      description: Reference to a node in the same Procedure.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.start"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.on.*"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.reconcile"
          scalarValue: true
    - id: ca.reference.local-tool
      status: current
      description: Reference to a Skill-local governed Tool identity.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.allowedResources.localTools[*]"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.tool"
          scalarValue: true
          supportStatus: documented-unverified
        - sourceFile: "skills/*/assurance/predicates.yaml"
          yamlPath: "$.predicates.*.evaluator.ref"
          scalarValue: true
      note: Local Tool references are recognized; resolution to Script metadata remains pending until the name-mapping rule is frozen.
    - id: ca.reference.script
      status: current
      description: Package-relative path to a governed Script.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.script"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.preconditions.steps[*].script"
          scalarValue: true
    - id: ca.reference.schema
      status: current
      description: Skill-owned schema path or schema registry reference.
      selectors:
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.inputs.requestSchema"
          scalarValue: true
    - id: ca.reference.binding-path
      status: current
      description: Explicit source path used by a from binding.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.inputs.*.from"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.with.*.from"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.preconditions.steps[*].with.*.from"
          scalarValue: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.postconditions.steps[*].with.*.from"
          scalarValue: true
    - id: ca.value.outcome
      status: current
      description: Result-domain value in an outcome or expectation position.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.on.*"
          mapKey: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.preconditions.on.*"
          mapKey: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*.postconditions.on.*"
          mapKey: true
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.applicability.predicates.*"
          scalarValue: true
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.preconditions[*].expect"
          scalarValue: true
        - sourceFile: "skills/*/assurance/contract.yaml"
          yamlPath: "$.spec.postconditions[*].expect"
          scalarValue: true
        - sourceFile: "skills/*/cases/*/case.yaml"
          yamlPath: "$.spec.expect.terminal"
          scalarValue: true
        - sourceFile: "skills/*/cases/*/case.yaml"
          yamlPath: "$.spec.expect.postconditions[*].expect"
          scalarValue: true
    - id: ca.value.effect
      status: current
      description: Effect value declared by an imported Operation, Script or Case resource.
      selectors:
        - sourceFile: "lib/**/*.yaml"
          yamlPath: "$.spec.contracts[*].effect"
          scalarValue: true
        - sourceFile: "skills/*/cases/*/case.yaml"
          yamlPath: "$.spec.context.availableResources[*].effect"
          scalarValue: true
        - sourceFile: "lib/capabilities/**/*.yaml"
          yamlPath: "$.spec.capabilities[*].operations[*].effect"
          scalarValue: true
        - sourceFile: "skills/*/scripts/*.py"
          metadataField: effect
          scalarValue: true
    - id: ca.value.type
      status: current
      description: Primitive type value in Procedure input declarations.
      selectors:
        - sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.inputs.*.type"
          scalarValue: true
    - id: ca.expression.cel
      status: current
      description: CEL expression in a Predicate evaluator.
      selectors:
        - sourceFile: "skills/*/assurance/predicates.yaml"
          yamlPath: "$.predicates.*.evaluator.expression"
          scalarValue: true
    - id: ca.identifier.user-defined
      status: current
      description: User-defined names not classified as a keyword or a known symbol/reference.
      fallback: true
      note: Do not apply to every scalar; use the parsed source position and artifact context.
  referenceGraph:
    resolutionPolicy: exact
    noFuzzyMatching: true
    resourceGrantResolution:
      source: contract.spec.allowedResources.capabilities[]
      exactTargetOrder:
        - CapabilityContracts.spec.capabilities[].capability
        - ToolCatalog.spec.contracts[].operation
      operationFallbackMeaning: direct-operation-grant
      noFuzzyMatching: true
    edges:
      - kind: capability
        definition:
          sourceFile: "lib/capabilities/**/*.yaml"
          documentKind: CapabilityContracts
          yamlPath: "$.spec.capabilities[*].capability"
        references:
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.allowedResources.capabilities[*]"
        status: optional-import-not-present
        note: CapabilityContracts are deployment-owned and not imported in the current project; capability definitions become navigable when an explicit read-only snapshot is imported.
      - kind: operation
        definition:
          sourceFile: "lib/tools/**/*.yaml"
          documentKind: ToolCatalog
          yamlPath: "$.spec.contracts[*].operation"
        references:
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.call"
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.allowedResources.capabilities[*]"
            resolutionRole: direct-operation-grant-fallback
        status: partial
        note: The conventional Skill's 12 direct Operation grants and calls resolve in the current ToolCatalog; the MAS Skill's 16 Operation identities are absent from the approved catalog and remain unresolved.
      - kind: predicate
        definition:
          sourceFile: "skills/*/assurance/predicates.yaml"
          yamlPath: "$.predicates.*"
        references:
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.preconditions[*].predicate"
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.postconditions[*].predicate"
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.verify"
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.preconditions.steps[*].verify"
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.postconditions.steps[*].verify"
        status: current-source
      - kind: procedure
        definition:
          sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*"
        references:
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.entryProcedure"
        status: current-source
      - kind: procedure-node
        definition:
          sourceFile: "skills/*/assurance/procedure.yaml"
          yamlPath: "$.procedures.*.nodes.*"
        references:
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.start"
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.on.*"
          - sourceFile: "skills/*/assurance/procedure.yaml"
            yamlPath: "$.procedures.*.nodes.*.reconcile"
        status: current-source
      - kind: local-tool
        definition:
          sourceFile: "skills/*/scripts/*.py"
          metadataField: name
        references:
          - sourceFile: "skills/*/assurance/contract.yaml"
            yamlPath: "$.spec.allowedResources.localTools[*]"
          - sourceFile: "skills/*/assurance/predicates.yaml"
            yamlPath: "$.predicates.*.evaluator.ref"
        status: unresolved-name-mapping
        note: The Script metadata name and skill-prefixed localTools/evaluator IDs are not yet specified as a deterministic mapping.
  excluded:
    - syntax: rules.yaml / SkillRuleSet / ruleRefs
      status: design-only
      reason: Not part of current Skill source packages or the v0 grammar.
    - syntax: path / op / value Rule expression
      status: design-candidate
      reason: Candidate shared primitives, not current reserved syntax.
    - syntax: applicability.when
      status: documented-not-frozen
      reason: Older authoring example only; current conventional source uses applicability.predicates.
