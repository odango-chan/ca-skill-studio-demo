apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: ensure-pdu-session
spec:
  skillType: executable
  goal: pdu_session.ensure_target
  entryProcedure: ensure-session
  context:
    requiredFacts:
      - ue.registered
      - pdu_session.absent
      - pdu_session.target.satisfied
  allowedResources:
    capabilities:
      - pdu_session.create
      - pdu_session.reconcile
      - pdu_session.query
    localTools: []
  preconditions:
    - predicate: ue.registered
      expect: PASS
  postconditions:
    - predicate: pdu_session.target.satisfied
      expect: PASS
  planning:
    maxActions: 6
    allowDynamicProcedure: false
  failureSemantics:
    outcomeUnknown:
      requireReconcile: true
