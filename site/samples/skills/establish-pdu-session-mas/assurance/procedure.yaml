        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          addressStateRef:
            from: allocate-address.output.stateRef
          allocator:
            value: "LOCAL_POOL"
          ueAddress:
            from: allocate-address.output.ue_addr
        'on':
          COMMITTED: verify-confirm-address
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-confirm-address
          FAILED: cleanup
          DENIED: cleanup
      verify-confirm-address:
        verify: mas.establishment.address_confirmed
        'on':
          PASS: signal-access
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-confirm-address:
        reconcile: confirm-address
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
