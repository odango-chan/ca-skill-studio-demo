          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          updatedPolicyStateRef:
            from: update-policy.output.stateRef
          anchorStateRef:
            from: select-anchor.output.stateRef
          addressStateRef:
            from: allocate-address.output.stateRef
          upIntent:
            from: update-policy.output.up_intent
          upAnchor:
            from: select-anchor.output.up_anchor
          ueAddress:
            from: allocate-address.output.ue_addr
        'on':
          COMMITTED: verify-establish-user-plane
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-establish-user-plane
          FAILED: cleanup
          DENIED: cleanup
      verify-establish-user-plane:
        verify: mas.establishment.initial_resources_ready
        'on':
          PASS: confirm-address
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-establish-user-plane:
        reconcile: establish-user-plane
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      confirm-address:
