            value: "ESTABLISHED"
          sessionKeys:
            from: create-context.output.session_keys
        'on':
          COMMITTED: verify-emit-events
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-emit-events
          FAILED: cleanup
          DENIED: cleanup
      verify-emit-events:
        verify: mas.establishment.events_accounted
        'on':
          PASS: finalize-resources
