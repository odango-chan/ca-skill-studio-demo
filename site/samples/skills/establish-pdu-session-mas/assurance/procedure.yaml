          UNKNOWN: unresolved
      reconcile-emit-events:
        reconcile: emit-events
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      finalize-resources:
