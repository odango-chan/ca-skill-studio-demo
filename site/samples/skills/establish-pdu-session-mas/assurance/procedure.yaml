          COMMITTED: verify-cleanup
          NOT_COMMITTED: safe-stopped
          OUTCOME_UNKNOWN: reconcile-cleanup
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-cleanup:
        verify: mas.establishment.cleanup_complete
        'on':
          PASS: failed
          FAIL: safe-stopped
          UNKNOWN: unresolved
      reconcile-cleanup:
        reconcile: cleanup
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      done:
