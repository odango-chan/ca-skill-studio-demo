          contextStateRef:
            from: create-context.output.stateRef
          policyStateRef:
            from: create-policy.output.stateRef
          addressStateRef:
            from: allocate-address.output.stateRef
          sessionKeys:
            from: create-context.output.session_keys
          ueAddress:
