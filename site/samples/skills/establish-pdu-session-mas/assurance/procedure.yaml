          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          contextStateRef:
            from: create-context.output.stateRef
          addressStateRef:
            from: confirm-address.output.stateRef
          userPlaneStateRef:
            from: establish-user-plane.output.stateRef
          sessionKeys:
            from: create-context.output.session_keys
          ueAddress:
            from: allocate-address.output.ue_addr
          n4Seid:
            from: establish-user-plane.output.n4_seid
