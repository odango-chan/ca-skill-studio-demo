            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          anchorStateRef:
            from: select-anchor.output.stateRef
          allocator:
            value: "LOCAL_POOL"
          upAnchor:
            from: select-anchor.output.up_anchor
        'on':
          COMMITTED: verify-allocate-address
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-allocate-address
          FAILED: cleanup
          DENIED: cleanup
      verify-allocate-address:
        verify: mas.establishment.address_ready
        'on':
          PASS: update-policy
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-allocate-address:
        reconcile: allocate-address
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      update-policy:
