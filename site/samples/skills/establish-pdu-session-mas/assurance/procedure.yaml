      create-charging:
        call: ca.pdu_session.charging.create
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          updatedPolicyStateRef:
            from: update-policy.output.stateRef
          ratingGroupRefs:
            value: "default"
        'on':
          COMMITTED: verify-create-charging
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-create-charging
          FAILED: cleanup
          DENIED: cleanup
      verify-create-charging:
        verify: mas.establishment.charging_owned
