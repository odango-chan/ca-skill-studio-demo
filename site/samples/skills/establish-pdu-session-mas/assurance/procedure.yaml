          PASS: establish-user-plane
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-create-charging:
        reconcile: create-charging
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      establish-user-plane:
