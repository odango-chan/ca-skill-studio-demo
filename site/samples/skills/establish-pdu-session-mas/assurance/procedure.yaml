          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-finalize-resources:
        reconcile: finalize-resources
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      cleanup:
        call: ca.pdu_session.resources.cleanup
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
