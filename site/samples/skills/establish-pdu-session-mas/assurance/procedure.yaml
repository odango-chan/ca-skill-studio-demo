procedures:
  establish-session:
    inputs:
      ue:
        type: string
        from: context.subject.ueRef
      ingress:
        type: string
        from: context.facts.createdsession_ingress
      lifecycle:
        type: string
        from: context.facts.createdsession_lifecycle
      pduSessionId:
        type: integer
        from: context.request.pduSessionId
      pti:
        type: integer
        from: context.request.pti
      requestType:
        type: integer
        from: context.request.requestType
      dnn:
        type: string
        from: context.request.dnn
      sNssai:
        type: object
        from: context.request.sNssai
      servingPlmn:
        type: object
        from: context.request.servingPlmn
      requestedPduSessionType:
        type: string
        from: context.request.requestedPduSessionType
      requestedSscMode:
        type: integer
        from: context.request.requestedSscMode
    start: verify-eligible
    nodes:
      verify-eligible:
        verify: mas.establishment.eligible
        'on':
          PASS: validate-subscription
          FAIL: failed
          UNKNOWN: unresolved
      validate-subscription:
        call: ca.pdu_session.subscription.validate
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
        'on':
          COMMITTED: verify-validate-subscription
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-validate-subscription
          FAILED: cleanup
          DENIED: cleanup
      verify-validate-subscription:
        verify: mas.establishment.subscription_valid
        'on':
          PASS: secondary-auth
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-validate-subscription:
        reconcile: validate-subscription
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      secondary-auth:
        call: ca.pdu_session.secondary_auth.disposition
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          subscriptionStateRef:
            from: validate-subscription.output.stateRef
          required:
            value: 0
        'on':
          COMMITTED: verify-secondary-auth
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-secondary-auth
          FAILED: cleanup
          DENIED: cleanup
      verify-secondary-auth:
        verify: mas.establishment.secondary_auth_resolved
        'on':
          PASS: create-context
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-secondary-auth:
        reconcile: secondary-auth
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      create-context:
        call: ca.pdu_session.context.create
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          subscriptionStateRef:
            from: validate-subscription.output.stateRef
          authStateRef:
            from: secondary-auth.output.stateRef
          subSummary:
            from: validate-subscription.output.sub_summary
        'on':
          COMMITTED: verify-create-context
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-create-context
          FAILED: cleanup
          DENIED: cleanup
      verify-create-context:
        verify: mas.establishment.context_ready
        'on':
          PASS: register-uecm
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-create-context:
        reconcile: create-context
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      register-uecm:
        call: ca.pdu_session.uecm.register
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          contextStateRef:
            from: create-context.output.stateRef
          sessionKeys:
            from: create-context.output.session_keys
        'on':
          COMMITTED: verify-register-uecm
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-register-uecm
          FAILED: cleanup
          DENIED: cleanup
      verify-register-uecm:
        verify: mas.establishment.uecm_registered
        'on':
          PASS: create-policy
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-register-uecm:
        reconcile: register-uecm
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      create-policy:
        call: ca.pdu_session.policy.create
        with:
          ueRef:
            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
            from: input.requestedSscMode
          contextStateRef:
            from: create-context.output.stateRef
          subscriptionStateRef:
            from: validate-subscription.output.stateRef
          sessionKeys:
            from: create-context.output.session_keys
        'on':
          COMMITTED: verify-create-policy
          NOT_COMMITTED: cleanup
          OUTCOME_UNKNOWN: reconcile-create-policy
          FAILED: cleanup
          DENIED: cleanup
      verify-create-policy:
        verify: mas.establishment.policy_created
        'on':
          PASS: select-anchor
          FAIL: cleanup
          UNKNOWN: unresolved
      reconcile-create-policy:
        reconcile: create-policy
        'on':
          COMMITTED: safe-stopped
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
      select-anchor:
        call: ca.pdu_session.anchor.select
