            from: input.ue
          ingressRef:
            from: input.ingress
          lifecycleRef:
            from: input.lifecycle
          pduSessionId:
            from: input.pduSessionId
          pti:
            from: input.pti
          requestType:
            from: input.requestType
          dnn:
            from: input.dnn
          sNssai:
            from: input.sNssai
          servingPlmn:
            from: input.servingPlmn
          requestedPduSessionType:
            from: input.requestedPduSessionType
          requestedSscMode:
