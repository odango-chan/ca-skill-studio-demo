apiVersion: connectionagent.io/v1alpha1
kind: PredicateSet
metadata:
  skill: establish-pdu-session-mas
predicates:
  mas.establishment.eligible:
    observations:
      state:
        ref: mas.establishment.snapshot
        scope: '{"ueRef": subject.ueRef, "pduSessionId": request.pduSessionId, "ingressRef": facts.createdsession_ingress, "lifecycleRef": facts.createdsession_lifecycle}'
        freshness: 5s
    evaluator:
      type: cel
      expression: observations.state.eligible == true
  mas.establishment.subscription_valid:
