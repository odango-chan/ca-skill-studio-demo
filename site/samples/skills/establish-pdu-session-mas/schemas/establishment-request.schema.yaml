$schema: https://json-schema.org/draft/2020-12/schema
$id: establishment-request.schema.yaml
title: EstablishmentRequest
type: object
additionalProperties: false
required:
- pduSessionId
- pti
- requestType
- dnn
- sNssai
- servingPlmn
- requestedPduSessionType
- requestedSscMode
properties:
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
  pti:
    type: integer
    minimum: 1
    maximum: 254
  requestType:
    type: integer
    const: 1
  dnn:
    type: string
    pattern: ^[a-z0-9][a-z0-9.-]*$
  sNssai:
    type: object
    additionalProperties: false
    required:
    - sst
    properties:
      sst:
        type: integer
        minimum: 0
        maximum: 255
      sd:
        type: integer
        minimum: 0
        maximum: 16777214
  servingPlmn:
    type: object
    additionalProperties: false
    required:
    - mcc
    - mnc
    properties:
      mcc:
        type: string
        pattern: ^[0-9]{3}$
      mnc:
        type: string
        pattern: ^[0-9]{2,3}$
  requestedPduSessionType:
    type: string
    const: IPV4
  requestedSscMode:
    type: integer
    const: 1
