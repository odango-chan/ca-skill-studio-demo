$schema: https://json-schema.org/draft/2020-12/schema
$id: pcf-policy-inputs.schema.yaml
title: PcfPolicyInputs
description: Policy inputs selected by the Skill from verified subscription material.
  This value is not an authorization; the PCF create Backend still projects it into
  the Provider request and independently enforces the owner ranges.
type: object
additionalProperties: false
required:
- ambr
- defaultQos
- subscriptionSource
properties:
  ambr:
    type: object
    additionalProperties: false
    required:
    - uplink
    - downlink
    properties:
      uplink:
        type: string
        pattern: ^[0-9]+(\.[0-9]+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      downlink:
        type: string
        pattern: ^[0-9]+(\.[0-9]+)? (bps|Kbps|Mbps|Gbps|Tbps)$
  defaultQos:
    type: object
    additionalProperties: false
    required:
    - 5qi
    - arp
    properties:
      5qi:
        type: integer
        minimum: 0
        maximum: 255
      priorityLevel:
        type: integer
        minimum: 1
        maximum: 127
      arp:
        type: object
        additionalProperties: false
        required:
        - priorityLevel
        - preemptCap
        - preemptVuln
        properties:
          priorityLevel:
            type: integer
            minimum: 1
            maximum: 15
          preemptCap:
            enum:
            - MAY_PREEMPT
            - NOT_PREEMPT
            type: string
          preemptVuln:
            enum:
            - PREEMPTABLE
            - NOT_PREEMPTABLE
            type: string
  subscriptionSource:
    type: object
    additionalProperties: false
    required:
    - transactionRef
    - requestRef
    - fabricRecordRef
    - fabricRecordDigest
    properties:
      transactionRef:
        type: string
        minLength: 1
      requestRef:
        type: string
        minLength: 1
      fabricRecordRef:
        type: string
        minLength: 1
      fabricRecordDigest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
