apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: establish-pdu-session
spec:
  skillType: executable
  goal: pdu_session.initial_request_fulfilled
  entryProcedure: ue-requested-pdu-session-establishment
  inputs:
    requestSchema: schemas/establishment-request.schema.yaml
  context:
    requiredFacts:
    - createdsession_ingress
    - createdsession_lifecycle
    schemas:
      subject: lib/host/subject.schema.yaml
      facts: lib/host/facts.schema.yaml
      observations: lib/observations/context-observations.schema.yaml
      evidence: lib/host/evidence.schema.yaml
  allowedResources:
    capabilities:
    - sbi.udm.sm_data.get
    - ca.session.operation_context.read
    - ca.session.pcf_hold.bind
    - ca.session.udm_hold.bind
    - ca.session.n1n2_hold.bind
    - ca.session.pcf_create_inputs.read
    - sbi.udm.sdm_subscription.create
    - sbi.pcf.sm_policy.create
    - sbi.amf.n1n2.transfer
    - ca.session.resource_responsibility.transfer
    - ca.session.evidence.await
    - ca.session.establishment_response.prepare
  postconditions:
  - predicate: createdsession.ran.setup_accepted
    expect: PASS
  - predicate: createdsession.n4.forwarding_ready
    expect: PASS
  - predicate: createdsession.resources.managed
    expect: PASS
  planning:
    maxActions: 32
    allowDynamicProcedure: false
  failureSemantics:
    outcomeUnknown:
      requireReconcile: true
