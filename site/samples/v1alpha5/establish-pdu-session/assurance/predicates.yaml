# CA-SL v1alpha5 ordered Predicate signatures.
# All urn:example Schema IDs and Evidence guarantees below are UNPUBLISHED until their actual Owner releases them.
# Host admission, invocation/lifecycle correlation and hold/journal state are not Skill business Predicates.
# This file contains business predicates over the request, declared Operation Results/Evidence,
# and explicit read-only SMF session-context Observations. Linking must fail closed.
predicates:
  establishment.request.supported:
    parameters:
      - requestType: integer
      - requestedPduSessionType: string
      - requestedSscMode: integer
    evaluator:
      type: cel
      expression: requestType == 1 && requestedPduSessionType == "IPV4" && requestedSscMode == 1

  establishment.udm.subscription_owned:
    parameters:
      - subscription: ca::urn:example:5gc:udm-subscription-result:v1
    evidence:
      requires:
        subscription: [ca::udm.subscription-owned]
    evaluator:
      type: cel
      expression: >-
        subscription.creationState == "CREATED" &&
        subscription.ownership == "AGENT" &&
        subscription.managementState == "DURABLE"

  # The PCF Owner attests that Step 6 secondary authentication is not required and
  # that the PCF response contains no Step 9 modification trigger for this fixed profile.
  # It returns normalized policy data; association handles remain private to the Owner.
  establishment.pcf.association_owned:
    parameters:
      - association: ca::urn:example:5gc:pcf-association-result:v1
    evidence:
      requires:
        association: [ca::pcf.association-owned]
    evaluator:
      type: cel
      expression: >-
        association.creationState == "CREATED" &&
        association.ownership == "AGENT" &&
        association.managementState == "DURABLE" &&
        association.policyResult.resultDigest != "" &&
        association.profile.secondaryAuthenticationRequired == false &&
        association.profile.step9ModificationRequired == false

  establishment.amf.transfer_initiated:
    parameters:
      - response: ca::urn:example:5gc:amf-transfer-initiation:v1
      - initialN4Result: smf::urn:example:smf:n4-session-establishment-result:v1
    evidence:
      requires:
        response: [ca::amf.transfer-initiated]
    evaluator:
      type: cel
      # This confirms initiation ONLY and binds the payload to the exact N4 result.
      # It never proves RAN adoption or N4 forwarding state.
      expression: >-
        response.networkOutcome == "HTTP_RESPONSE" &&
        response.responseOrigin == "TARGET_SERVICE_VIA_SCP" &&
        response.captureComplete == true &&
        response.httpStatus == 200 &&
        response.cause == "N1_N2_TRANSFER_INITIATED" &&
        response.sessionConfigurationDigest == initialN4Result.sessionConfigurationDigest

  establishment.udm.response_valid:
    parameters:
      - receipt: ca::urn:example:5gc:udm-read-receipt:v1
    evidence:
      requires:
        receipt: [ca::udm.subscription-state]
    evaluator:
      type: cel
      expression: >-
        receipt.result.selection == "MATCHED" &&
        receipt.result.httpStatus == 200 &&
        receipt.result.networkOutcome == "HTTP_RESPONSE" &&
        receipt.result.responseOrigin == "TARGET_SERVICE_VIA_SCP" &&
        receipt.result.captureComplete == true

  # The UDM Owner Evidence binds this result to the exact UE/DNN/S-NSSAI/serving-PLMN query.
  establishment.subscription.request_valid:
    parameters:
      - receipt: ca::urn:example:5gc:udm-read-receipt:v1
      - requestedDnn: string
      - requestedSNssai: ca::urn:example:5gc:snssai:v1
      - requestedPduSessionType: string
      - requestedSscMode: integer
    evidence:
      requires:
        receipt: [ca::udm.subscription-state]
    evaluator:
      type: script
      script: scripts/validate-subscription-request.py

  # Entry decision: only an evidenced 404 SESSION_NOT_FOUND is ABSENT.
  # PRESENT (including projection UNAVAILABLE) is not permission to create.
  establishment.smf.session_context_absent:
    parameters:
      - sessionContext: ca-session-context::urn:connectionagent:ca:observation:smf-session-context-read-result:v1
    evidence:
      requires:
        sessionContext: [ca-session-context::smf.session-context.read-evidence]
    evaluator:
      type: script
      script: scripts/validate-smf-session-context-entry.py

  # Validate current SMF-owned facts after Step 15 and before N4 Modification.
  establishment.smf.session_context_profile_ready:
    parameters:
      - sessionContext: ca-session-context::urn:connectionagent:ca:observation:smf-session-context-read-result:v1
      - requestedDnn: string
      - requestedSst: integer
    evidence:
      requires:
        sessionContext: [ca-session-context::smf.session-context.read-evidence]
    evaluator:
      type: script
      script: scripts/validate-smf-session-context.py

  establishment.n4.initial_resources_ready:
    parameters:
      - resources: smf::urn:example:smf:n4-session-establishment-result:v1
      - requestedDnn: string
      - requestedSst: integer
      - requestedPduSessionType: string
      - requestedSscMode: integer
    evidence:
      requires:
        resources: [smf::n4.initial-resources-ready]
    evaluator:
      type: cel
      expression: >-
        resources.bindingStatus == "CURRENT" &&
        resources.defaultFlowInstalled == true &&
        resources.uplinkEndpointBound == true &&
        resources.allocatedIpv4 != "" &&
        resources.selectedDnn == requestedDnn &&
        resources.selectedSst == requestedSst &&
        resources.selectedPduSessionType == requestedPduSessionType &&
        resources.selectedSscMode == requestedSscMode &&
        resources.sessionConfigurationDigest != ""

  establishment.ran.adopted:
    parameters:
      - network: smf::urn:example:smf:nsmf-update-sm-context-result:v1
    evidence:
      requires:
        network: [smf::nsmf.ran-adopted]
    evaluator:
      type: cel
      expression: >-
        network.result == "ACCEPTED" &&
        network.requiredFlowMatched == true &&
        network.currentInstanceBound == true &&
        network.baselineRanEndpointPresent == false

  establishment.n4.forwarding_ready:
    parameters:
      - network: smf::urn:example:smf:n4-session-modification-result:v1
      - initialN4Result: smf::urn:example:smf:n4-session-establishment-result:v1
      - ranResult: smf::urn:example:smf:nsmf-update-sm-context-result:v1
    evidence:
      requires:
        network: [smf::n4.forwarding-ready]
    evaluator:
      type: cel
      expression: >-
        network.bindingStatus == "CURRENT" &&
        network.requiredFlowMatched == true &&
        network.downlinkTunnelMatched == true &&
        network.gatesAllowForwarding == true &&
        network.sessionConfigurationDigest == initialN4Result.sessionConfigurationDigest &&
        network.ranResultDigest == ranResult.resultDigest

  establishment.udm.uecm_registration_satisfied:
    parameters:
      - registration: ca::urn:example:5gc:udm-uecm-registration-result:v1
      - supi: string
      - pduSessionId: integer
    evidence:
      requires:
        registration: [ca::udm.uecm-registration]
    evaluator:
      type: cel
      expression: >-
        registration.registrationState in ["REGISTERED", "ALREADY_REGISTERED"] &&
        registration.supi == supi &&
        registration.pduSessionId == pduSessionId &&
        registration.managementState == "DURABLE"
