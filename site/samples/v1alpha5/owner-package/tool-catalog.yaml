      evidence:
        provides:
        - guarantee: sc.subscription-validated
          path: output
    receiptSchema:
      $ref: urn:openamsm:mas:v1alpha4:mutation-receipt
    mutation:
      commitProof:
        schema: urn:openamsm:mas:v1alpha4:commit-proof
        path: receipt.commit
        bind: originalInvocationId
      failureClassPath: receipt.failureClass
      failureClasses:
      - id: openamsm.mas.owner.rejected
        outcome: NOT_COMMITTED
        proofSchema: urn:openamsm:mas:v1alpha4:commit-proof
        proofPath: receipt.commit
        noSideEffect: true
        retryable: false
