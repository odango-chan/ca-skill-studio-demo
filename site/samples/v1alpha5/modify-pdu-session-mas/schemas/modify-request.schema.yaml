$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:modify-request:v1alpha5
title: ModifyRequest
description: Host-normalized entry classification. The raw N1 stays in the Host's private execution context and is never a Skill-authored request field; the Owner, not the Host, decodes the requested QoS target.
type: object
additionalProperties: false
required: [pduSessionId, entryKind]
properties:
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
  entryKind:
    type: string
    enum: [UE_INITIATED, AMF_INITIATED, NETWORK_TRIGGERED]
