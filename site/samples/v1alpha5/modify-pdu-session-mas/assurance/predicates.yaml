# CA-SL v1alpha5 PredicateSet.
# Every MAS Schema and Evidence Guarantee below is an unpublished Owner candidate.
predicates:
  modify.request.admitted:
    parameters:
      - supi: string
      - pduSessionId: integer
      - entryKind: string
    evaluator:
      type: cel
      expression: >-
        supi != "" &&
        pduSessionId >= 1 &&
        pduSessionId <= 15 &&
        (entryKind == "UE_INITIATED" ||
         entryKind == "AMF_INITIATED" ||
         entryKind == "NETWORK_TRIGGERED")

  # The Owner decoded the exact original N1 and returned one GBR QoS flow
  # description. A non-GBR or multi-flow request fails here rather than being
  # mutated with an unrequested bitrate.
  modify.mas.n1_parsed:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:ssm-parse_n1_modify-output
    evidence:
      requires:
        result: [mas::ssm.n1-modify-parsed]
    evaluator:
      type: cel
      expression: >-
        result.qfi != "" &&
        result.requested_kind == "qos_flow_descriptions" &&
        result.five_qi != "" &&
        result.gfbr_ul != "" &&
        result.gfbr_dl != "" &&
        result.mfbr_ul != "" &&
        result.mfbr_dl != ""

  # State semantics (Owner contract):
  # - APPLIED: the PFCP Update QER was accepted AND the native N1/N2 Modify was
  #   dispatched (n1n2_dispatched == "1").
  # - ALREADY: the Owner's authoritative flow already equals the exact target;
  #   no PFCP and no N1/N2 were dispatched.
  # - PFCP_APPLIED_N1N2_FAILED never satisfies this Goal.
  # The applied result is compared field by field with the *parsed* N1 target
  # (the Owner's decode of the request), using canonical decimal strings, so
  # CEL string equality is exact equality. Both inputs are Owner Producer
  # outputs with their own declared Evidence guarantees.
  modify.mas.qos_delta_applied:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:upn-modify_qos_delta-output
      - parsed: mas::urn:openamsm:mas:v1alpha4:ssm-parse_n1_modify-output
    evidence:
      requires:
        result: [mas::upn.qos-delta-applied]
        parsed: [mas::ssm.n1-modify-parsed]
    evaluator:
      type: cel
      expression: >-
        ((result.qos_delta_state == "APPLIED" &&
          has(result.n1n2_dispatched) &&
          result.n1n2_dispatched == "1") ||
         (result.qos_delta_state == "ALREADY" &&
          !has(result.n1n2_dispatched))) &&
        result.qfi == parsed.qfi &&
        has(result.five_qi) && result.five_qi == parsed.five_qi &&
        result.gfbr_ul == parsed.gfbr_ul &&
        result.gfbr_dl == parsed.gfbr_dl &&
        result.mfbr_ul == parsed.mfbr_ul &&
        result.mfbr_dl == parsed.mfbr_dl
