# CA-SL v1alpha5. Scheme C occurrences of the merged OpenAMSM Owner.
#
# The Owner decodes the exact retained 5GSM PDU Session Modification Request
# (0xc9) and applies the typed QoS delta in one native transaction
# (`SSM.SIGNAL_UE_AN(parse_n1=1)` -> `UPN.MODIFY_UP_SESSION(qos_flows_delta=1)`).
# The Host retains the original NAS bytes and the SUPI/PSI/generation; it never
# derives the QoS target from an AMF JSON field.
start: validate-modify-request
nodes:
  validate-modify-request:
    precondition:
      predicates:
        - predicate: modify.request.admitted
          arguments:
            - context.supi
            - context.request.pduSessionId
            - context.request.entryKind
      routes:
        PASS: parse-n1
        FAIL: FAILED
        UNKNOWN: UNRESOLVED

  # Scheme C c-parse: read-only decode of the exact original N1. The Owner
  # returns the typed GBR/MBR target; the Skill does not parse NAS.
  parse-n1:
    operation:
      tool: mas::SSM.PARSE_N1_MODIFY
      arguments:
        ue_identity: context.supi
        psi: context.request.pduSessionId
        parse_n1: "1"
      routes:
        FAILED: FAILED
        DENIED: FAILED
    postcondition:
      predicates:
        - predicate: modify.mas.n1_parsed
          arguments:
            - parse-n1.operation.output
      routes:
        PASS: apply-qos-delta
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # Scheme C c-apply: the Owner validates the target against the authoritative
  # flow, applies PFCP Session Modification 52/53 and dispatches N1 0xcb plus
  # N2 PDU_RES_MOD_REQ through the agent relay. It completes only after the
  # relay's Namf Transfer is accepted.
  apply-qos-delta:
    operation:
      tool: mas::UPN.MODIFY_QOS_DELTA
      arguments:
        ue_identity: context.supi
        psi: context.request.pduSessionId
        qos_flows_delta: "1"
        qfi: parse-n1.operation.output.qfi
        five_qi: parse-n1.operation.output.five_qi
        gfbr_ul: parse-n1.operation.output.gfbr_ul
        gfbr_dl: parse-n1.operation.output.gfbr_dl
        mfbr_ul: parse-n1.operation.output.mfbr_ul
        mfbr_dl: parse-n1.operation.output.mfbr_dl
      routes:
        NOT_COMMITTED: FAILED
        FAILED: FAILED
        DENIED: FAILED
        OUTCOME_UNKNOWN: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: modify.mas.qos_delta_applied
          arguments:
            - apply-qos-delta.operation.output
            - parse-n1.operation.output
      routes:
        PASS: verify-modify-completion
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  verify-modify-completion:
    postcondition:
      predicates:
        - predicate: modify.mas.n1_parsed
          arguments:
            - parse-n1.operation.output
        - predicate: modify.mas.qos_delta_applied
          arguments:
            - apply-qos-delta.operation.output
            - parse-n1.operation.output
      routes:
        PASS: SUCCEEDED
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

