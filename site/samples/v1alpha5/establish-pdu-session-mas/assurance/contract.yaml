# CA-SL v1alpha5 author syntax. The MAS dependency is the published OpenAMSM Owner
# contract package (env-openamsm contracts/mas/v1alpha4).
# Subject Context carries the 3GPP SUPI from the admitted CreateSMContext request; HostBusinessInstance and Runtime identities remain private.
goal: pdu_session.initial_request_fulfilled
precondition: validate-sm-subscription.precondition
requestSchema: schemas/establishment-request.schema.yaml
contextSchema: ca-context::urn:connectionagent:ca:context:subject:v1
dependencies:
  ca-context: urn:connectionagent:ca:host-context
  mas: urn:openamsm:mas:tool-contracts
capabilities:
  - mas.sc.subscription.validate
  - mas.saa.secondary.auth
  - mas.sc.context.create
  - mas.sc.uecm.register
  - mas.pa.sm.policy.create
  - mas.ups.anchor.decide
  - mas.iam.address.allocate
  - mas.pa.sm.policy.update
  - mas.ca.charging.create
  - mas.upn.up.session.create
  - mas.ssm.ue.an.signal
  - mas.upn.up.session.modify
  - mas.se.events.emit
limits:
  maxActions: 32
