# CA-SL v1alpha5 predicates for the OpenAMSM MAS policy-first example.
# Every MAS Schema and Evidence Guarantee below is an unpublished source-derived
# placeholder. Linking must fail closed until the MAS Owner publishes exact exports.
predicates:
  establishment.request.supported:
    parameters:
      - requestType: integer
      - requestedPduSessionType: string
      - requestedSscMode: integer
    evaluator:
      type: cel
      expression: requestType == 1 && requestedPduSessionType == "IPV4" && requestedSscMode == 1

  establishment.mas.subscription_validated:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:sc-validate_subscription-output
    evidence:
      requires:
        result: [mas::sc.subscription-validated]
    evaluator:
      type: cel
      expression: result.sub_summary == "ok"

  establishment.mas.secondary_auth_skipped:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:saa-secondary_auth-output
    evidence:
      requires:
        result: [mas::saa.secondary-auth-disposition]
    evaluator:
      type: cel
      expression: result.phase == "SKIPPED"

  establishment.mas.context_created:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:sc-create_sm_context-output
    evidence:
      requires:
        result: [mas::sc.context-created]
    evaluator:
      type: cel
      expression: result.lifecycle == "OPERATIONAL" && result.session_keys != ""

  establishment.mas.uecm_registered:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:sc-register_uecm-output
    evidence:
      requires:
        result: [mas::sc.uecm-registered]
    evaluator:
      type: cel
      expression: result.uecm_registered == "1"

  establishment.mas.policy_association_created:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:pa-create_sm_policy-output
    evidence:
      requires:
        result: [mas::pa.policy-association-created]
    evaluator:
      type: cel
      expression: result.policy_assoc_id != "" && result.policy_assoc_id != "bound"

  establishment.mas.anchor_selected:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:ups-decide_anchor-output
    evidence:
      requires:
        result: [mas::ups.anchor-selected]
    evaluator:
      type: cel
      expression: result.up_anchor == "1"

  establishment.mas.address_allocated:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:iam-allocate_address-output
    evidence:
      requires:
        result: [mas::iam.address-allocated]
    evaluator:
      type: cel
      expression: result.ue_addr == "1"

  establishment.mas.policy_updated:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:pa-update_sm_policy-output
    evidence:
      requires:
        result: [mas::pa.policy-updated]
    evaluator:
      type: cel
      expression: result.policy_assoc_id != "" && result.policy_assoc_id != "bound"

  # The pinned NW Agent source returns SMF_MAS_OK, charging_ref="1" and
  # records NOT_IMPL_skip. This proves only that the required s7 plan step
  # completed under the current stub; it does not prove a charging reservation.
  establishment.mas.charging_step_completed:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:ca-create_charging-output
    evidence:
      requires:
        result: [mas::ca.charging-step-skipped]
    evaluator:
      type: cel
      expression: result.charging_ref == "1"

  establishment.mas.n4_session_established:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:upn-create_up_session-output
    evidence:
      requires:
        result: [mas::upn.n4-session-established]
    evaluator:
      type: cel
      expression: result.est_done == "1" && result.n4_seid != "" && result.n4_seid != "0"

  establishment.mas.access_network_ready:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:ssm-signal_ue_an-output
    evidence:
      requires:
        result: [mas::ssm.access-network-ready]
    evaluator:
      type: cel
      expression: result.an_tunnel == "1" && result.an_tunnel_teid != "" && result.an_tunnel_ip != ""

  establishment.mas.n3_synchronized:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:upn-modify_up_session-output
    evidence:
      requires:
        result: [mas::upn.n3-synchronized]
    evaluator:
      type: cel
      expression: result.n3_synced == "1"

  establishment.mas.establishment_event_recorded:
    parameters:
      - result: mas::urn:openamsm:mas:v1alpha4:se-emit_events-output
    evidence:
      requires:
        result: [mas::se.establishment-event-recorded]
    evaluator:
      type: cel
      expression: result.last_event == "1"
