$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:release-request:v1alpha5
title: ReleaseRequest
description: Host-normalized UE release entry. The raw N1 and the Host-private transaction identity stay in the Host's private execution context and are never Skill-authored request fields.
type: object
additionalProperties: false
required: [pduSessionId, entryKind, trigger]
properties:
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
  entryKind:
    type: string
    enum: [UE_INITIATED]
  trigger:
    type: integer
    minimum: 1
    maximum: 7
