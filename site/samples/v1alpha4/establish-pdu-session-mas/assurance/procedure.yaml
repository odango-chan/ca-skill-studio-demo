# v1alpha4 MAS policy-first DAG. Tool/Owner exports are NOT YET PUBLISHED.
# Host, not author Nodes, performs trusted mutation.reconcile when available.
start: check-request
nodes:
  check-request:
    precondition:
      predicates:
        - predicate: establishment.request.supported
          arguments:
            - context.request.requestType
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
      routes:
        PASS: validate-subscription
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
  validate-subscription:
    operation:
      tool: mas::ca.pdu_session.subscription.validate
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: verify-subscription
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  verify-subscription:
    precondition:
      predicates:
        - predicate: establishment.mas.subscription_usable
          arguments:
            - validate-subscription.operation.output
      routes:
        PASS: secondary-auth
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
  secondary-auth:
    operation:
      tool: mas::ca.pdu_session.secondary_auth.disposition
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: create-context
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  create-context:
    operation:
      tool: mas::ca.pdu_session.context.create
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: register-uecm
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  register-uecm:
    operation:
      tool: mas::ca.pdu_session.uecm.register
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: create-policy
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  create-policy:
    operation:
      tool: mas::ca.pdu_session.policy.create
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: select-anchor
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  select-anchor:
    operation:
      tool: mas::ca.pdu_session.anchor.select
      arguments:
        ueRef: context.ueRef
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
