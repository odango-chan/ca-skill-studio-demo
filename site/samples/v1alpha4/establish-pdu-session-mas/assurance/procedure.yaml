        lifecycleRef: context.correlation.lifecycleRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: verify-final
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  verify-final:
    postcondition:
      predicates:
        - predicate: establishment.mas.ran_adopted
          arguments:
            - signal-access.operation.output
        - predicate: establishment.mas.forwarding_ready
          arguments:
            - activate-n4.operation.output
        - predicate: establishment.mas.resources_managed
          arguments:
            - finalize-resources.operation.output
      routes:
        PASS: SUCCEEDED
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
