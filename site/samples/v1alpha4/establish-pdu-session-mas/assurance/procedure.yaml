        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        SUCCEEDED: allocate-address
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  allocate-address:
