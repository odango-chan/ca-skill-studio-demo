<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f7fb">
  <title>ConnectionAgent — SKILL Studio</title>
  <link rel="stylesheet" href="./studio.css">
  <link rel="stylesheet" href="./light.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true"><span></span><span></span><span></span></span>
      <div class="brand-title"><strong>SKILL Studio</strong></div>
    </div>
    <span id="fileName" class="top-file" title="当前工作文件">正在载入…</span>
    <div class="topbar-actions">
      <span class="workspace-status" id="fileStatus" role="status"><span class="status-dot"></span>未修改</span>
      <button id="undoButton" class="icon-button" type="button" title="撤销 · Ctrl/Cmd + Z" disabled aria-label="撤销">↶</button>
      <button id="redoButton" class="icon-button" type="button" title="重做 · Ctrl/Cmd + Shift + Z" disabled aria-label="重做">↷</button>
      <button id="downloadButton" class="button-primary" type="button" title="导出当前文件 · Ctrl/Cmd + S"><span aria-hidden="true">↓</span> 导出文件</button>
    </div>
  </header>

  <main class="workbench" id="workbench" data-explorer="open" data-inspector="closed">
    <aside class="explorer" id="explorerPanel" aria-label="SKILL Explorer">
      <section class="explorer-section asset-section" aria-label="当前文件和流程">
        <div class="explorer-compact-heading">文件 <span id="fileCount" class="scope-tag" title="工作区实际加载的文件数量">单文件</span></div>
        <div id="assetTree" class="asset-tree"></div>
        <nav id="procedureTree" class="procedure-tree" aria-label="当前文件的 Procedure"></nav>
        <span id="procedureCount" class="sr-only"></span>
        <select id="procedurePicker" class="sr-only" aria-label="切换 Procedure"></select>
      </section>
      <details class="explorer-section explorer-nodes" id="nodeOutlineDisclosure">
        <summary class="section-heading node-disclosure-heading"><span>NODES · 当前 Procedure</span><span id="outlineCount" class="count">—</span></summary>
        <label for="search" class="sr-only">搜索当前 Procedure 的节点</label>
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="查找节点" autocomplete="off"></div>
        <ol id="nodeOutline" class="outline"></ol>
      </details>
      <div class="explorer-bottom">
        <button id="openButton" type="button" class="explorer-action">＋ 打开本地文件</button>
        <button id="exportPackageButton" type="button" class="explorer-action" hidden>↓ 导出整个 Package (.zip)</button>
        <details class="sample-picker">
          <summary>加载示例</summary>
          <button id="establishSampleButton" type="button" class="explorer-action">CreatedSession</button>
          <button id="sampleButton" type="button" class="explorer-action">Ensure Session</button>
        </details>
        <input id="filePicker" type="file" hidden accept=".yaml,.yml,.md,.json,.txt,.py,.js,.ts,.sh,text/plain">
      </div>
    </aside>

    <section class="editor" aria-label="Procedure authoring editor">
      <div class="editorbar compact-toolbar">
        <button id="toggleExplorer" class="panel-toggle" type="button" aria-controls="explorerPanel" aria-expanded="true" title="展开或收起文件导航">☰</button>
        <div class="breadcrumbs">
          <button id="backProcedure" type="button" title="返回 Root Procedure">←</button>
          <span id="procedureBread">Procedure</span>
        </div>
        <div class="segmented" role="group" aria-label="编辑视图">
          <button id="mode-visual" type="button" aria-pressed="true">Visual</button>
          <button id="mode-source" type="button" aria-pressed="false">Source</button>
          <button id="mode-split" type="button" aria-pressed="false">Split</button>
        </div>
        <span class="mode-spacer"></span>
        <details class="view-menu" id="viewMenu">
          <summary aria-label="图形视图设置">视图 <span aria-hidden="true">⌄</span></summary>
          <div class="view-menu-panel">
            <div class="menu-heading">图形显示</div>
            <label class="menu-field" for="layoutDirection">布局方向
              <select id="layoutDirection" aria-label="自动布局方向">
                <option value="RIGHT">水平 · 左到右</option>
                <option value="DOWN">垂直 · 上到下</option>
              </select>
            </label>
            <button id="neighborsOnly" type="button" aria-pressed="false" title="仅显示选中节点的一跳邻居">只看直接邻居</button>
            <button id="showAllLabels" type="button" aria-pressed="false" title="显示全部 Route 的标签">显示全部 Route 标签</button>
            <button id="centerSelection" type="button">定位当前选择</button>
            <div class="menu-divider"></div>
            <div class="menu-heading">操作</div>
            <button id="resetButton" type="button" title="恢复打开时的原始文本">恢复初始文件</button>
            <div class="menu-divider"></div>
            <div class="menu-heading">缩放</div>
            <div class="menu-zoom">
              <button id="zoomOut" type="button" aria-label="缩小">−</button>
              <button id="zoomIn" type="button" aria-label="放大">+</button>
            </div>
          </div>
        </details>

        <button id="fit" class="fit-control" type="button" title="适配画布">适配</button>
      </div>
      <div id="editorBody" class="editor-body" data-mode="visual">
        <div id="graphPane" class="graph-pane" data-labels="key">
          <svg id="canvas" aria-label="Procedure control flow" role="img">
            <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9cb0c7"></path></marker></defs>
            <g id="world"></g>
          </svg>
          <div id="graphWarning" class="graph-warning" role="alert" hidden></div>
        </div>
        <div id="sourcePane" class="source-pane">
          <div class="source-caption"><span class="source-indicator"></span> YAML</div>
          <label for="source" class="sr-only">Procedure YAML Source</label>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
      </div>
      <div class="editor-foot">
        <span id="stats">0 行</span>
        <span id="projectionState" role="status">正在载入…</span>
        <span id="layoutStatus" role="status"></span>
        <span id="hint" role="status"></span>
      </div>
    </section>

    <aside class="inspector-panel" id="inspectorPanel" aria-label="Node inspector">
      <div class="inspector-header"><span class="eyebrow">属性</span><span id="inspectorState" class="inspector-status">只读</span><button id="closeInspector" type="button" class="quick-close" aria-label="收起详情" title="收起详情">×</button></div>
      <div id="inspectorContext" class="inspector-context"><h2>流程属性</h2><p>选择图上的一个节点查看详情</p></div>
      
      <div id="inspector" class="inspector-content" aria-live="polite"></div>
    </aside>
  </main>

  <section id="problems" class="problems" aria-label="Editor diagnostics" hidden></section>


  <div id="patchDialog" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="patchTitle" hidden>
    <div class="modal-content">
      <div class="modal-kicker">SOURCE CHANGE PREVIEW</div><h2 id="patchTitle">确认源码修改</h2>
      <p id="patchSummary"></p><p class="modal-warning">仅允许已授权的字段或 Route 修改。请核对源码差异；此操作不等于完整 Runtime Validator 通过。</p>
      <pre id="patchDiff" aria-label="YAML source diff"></pre>
      <div class="modal-actions"><button id="closePatch" type="button">取消</button><button id="applyPatch" type="button" class="button-primary">确认应用修改</button></div>
    </div>
  </div>
</div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
