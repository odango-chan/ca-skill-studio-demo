name: Verify Theia Browser-Only Online Spike

on:
  pull_request:
    paths:
      - "experiments/ide-host/**"
      - "extensions/skill-studio-theme/**"
      - "extensions/skill-studio-languages/**"
      - ".github/workflows/theia-online-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theia-browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Studio dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser LSP client and server dependencies
        run: |
          npm ci --prefix experiments/ide-host/lsp-browser/client --omit=dev --no-audit --no-fund
          npm ci --prefix experiments/ide-host/lsp-browser/server --no-audit --no-fund
      - name: Build Node and browser Procedure extensions
        run: node experiments/ide-host/scripts/build-ide-spike.mjs
      - name: Checkout pinned CA Skill Compiler v2.1.0 source
        uses: actions/checkout@v4
        with:
          repository: odango-chan/ca-skill-compiler
          ref: b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65
          path: compiler-source
          token: ${{ secrets.CA_SKILL_COMPILER_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned CA Skill Compiler v2.1.0 source identity
        working-directory: compiler-source
        run: |
          test "$(git rev-parse HEAD)" = "b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65"
          grep -F 'const CompilerVersion = "v2.1.0"' internal/compiler/version.go
      - name: Download and verify official Compiler v2.1.0 Worker bundle
        working-directory: compiler-source
        run: |
          set -euo pipefail
          mkdir -p dist ../experiments/ide-host/vscode/dist
          release="https://github.com/odango-chan/ca-skill-compiler/releases/download/v2.1.0"
          curl -fsSL "$release/SHA256SUMS" -o dist/SHA256SUMS
          curl -fsSL "$release/skillc-v2.1.0-web-worker.tar.gz" -o dist/skillc-v2.1.0-web-worker.tar.gz
          (cd dist && grep -F "skillc-v2.1.0-web-worker.tar.gz" SHA256SUMS | sha256sum --check)
          tar -xzf dist/skillc-v2.1.0-web-worker.tar.gz -C dist
          test -s dist/skillc.wasm
          test -s dist/wasm_exec.js
          cp dist/skillc.wasm ../experiments/ide-host/vscode/dist/skillc.wasm
          cp dist/wasm_exec.js ../experiments/ide-host/vscode/dist/wasm_exec.js
          cp docs/design/fixtures/registration-development-request.json ../experiments/ide-host/vscode/dist/authoring-development-build-request.json
      - name: Stage web plugin for browser-only Theia
        run: node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Stage web plugin for browser-only Theia
        run: node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Validate trial package manifest and prepared plugin
        run: node --test experiments/ide-host/tests/online-host.test.mjs
      - name: Install isolated pinned Theia 1.76 dependencies
        run: npm install --prefix experiments/ide-host/theia-online --no-audit --no-fund --ignore-scripts
      - name: Link fixed workbench to the app's exact Theia core
        run: node experiments/ide-host/scripts/link-fixed-workbench-core.mjs experiments/ide-host/theia-online
      - name: Compile fixed-workbench Theia frontend module
        run: npm run build:fixed-workbench --prefix experiments/ide-host/theia-online
      - name: Download pinned built-in Markdown extension from Open VSX
        run: npm run download:plugins --prefix experiments/ide-host/theia-online
      - name: Build real Theia browser-only app
        run: npm run build --prefix experiments/ide-host/theia-online
      - name: Prepare same-origin Webview assets for static demo preview
        run: node experiments/ide-host/scripts/prepare-theia-static-preview.mjs
      - name: Apply SKILL Studio menu branding
        run: node experiments/ide-host/scripts/prepare-theia-brand.mjs experiments/ide-host/theia-online/lib/frontend
      - name: Verify fixed Main Editor group in real Chromium
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo/fixed-layout-test"
        run: node experiments/ide-host/scripts/theia-fixed-layout-smoke.mjs
      - name: Inventory generated frontend and bundled web plugin
        run: |
          find experiments/ide-host/theia-online/lib -maxdepth 5 -type f -name 'index.html' -o -name 'list.json' | head -40
          node experiments/ide-host/scripts/check-theia-online.mjs
      - name: Launch generated browser-only shell in real headless Chromium
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo/ide-preview"
          THEIA_REQUIRE_WEBVIEW: "1"
          THEIA_REQUIRE_BROWSER_LSP: "1"
          THEIA_REQUIRE_COMPILER_WORKER: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      - name: Upload isolated online frontend preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-studio-theia-online-spike
          path: experiments/ide-host/theia-online/lib/frontend/
          if-no-files-found: error
          retention-days: 7

