name: Verify Theia Browser-Only Online Spike

on:
  pull_request:
    paths:
      - "experiments/ide-host/**"
      - ".github/workflows/theia-online-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theia-browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Studio dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Node and browser Procedure extensions
        run: node experiments/ide-host/scripts/build-ide-spike.mjs
      - name: Stage web plugin for browser-only Theia
        run: node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Validate trial package manifest and prepared plugin
        run: node --test experiments/ide-host/tests/online-host.test.mjs
      - name: Install isolated pinned Theia 1.76 dependencies
        run: npm install --prefix experiments/ide-host/theia-online --no-audit --no-fund --ignore-scripts
      - name: Build real Theia browser-only app
        run: npm run build --prefix experiments/ide-host/theia-online
      - name: Prepare same-origin Webview assets for static demo preview
        run: node experiments/ide-host/scripts/prepare-theia-static-preview.mjs
      - name: Inventory generated frontend and bundled web plugin
        run: |
          find experiments/ide-host/theia-online/lib -maxdepth 5 -type f -name 'index.html' -o -name 'list.json' | head -40
          node experiments/ide-host/scripts/check-theia-online.mjs
      - name: Launch generated browser-only shell in real headless Chromium
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo/ide-preview"
          THEIA_REQUIRE_WEBVIEW: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      - name: Upload isolated online frontend preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-studio-theia-online-spike
          path: experiments/ide-host/theia-online/lib/frontend/
          if-no-files-found: error
          retention-days: 7

  publish-isolated-preview:
    # Never grant Pages deployment to arbitrary forks or other PRs.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 86 && github.event.pull_request.head.ref == 'spike/ide-extension-theia-host' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: theia-browser-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: skill-studio-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published main only (preserve existing site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build main website unchanged
        working-directory: main-source
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
          node scripts/edge-smoke.mjs
      - name: Include verified isolated preview under its own path
        uses: actions/download-artifact@v4
        with:
          name: skill-studio-theia-online-spike
          path: main-source/dist/ide-preview
      - name: Verify root and preview before deployment
        run: |
          test -s main-source/dist/index.html
          test -s main-source/dist/ide-preview/index.html
          test -s main-source/dist/ide-preview/hostedPlugin/list.json
          test -s main-source/dist/ide-preview/webview/index.html
          test -s main-source/dist/ide-preview/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/samples/establish-pdu-session/files.json
          printf '%s\\n' 'Existing main root preserved; /ide-preview is isolated.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload main site plus isolated preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: main-source/dist
      - name: Publish separate demo preview path
        id: deployment
        uses: actions/deploy-pages@v4
