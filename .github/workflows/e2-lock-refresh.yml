name: E2-A2 temporary npm lock refresh

on:
  push:
    branches:
      - feat/e2-a2-monaco-yaml-owner-schemas

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh package lock from exact manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lock
        run: |
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): lock monaco-yaml 5.5.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
