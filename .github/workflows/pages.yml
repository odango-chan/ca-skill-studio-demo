name: Deploy Skill Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "experiments/ide-host/**"
      - "extensions/skill-studio-theme/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-source
    steps:
      - name: Checkout current published site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Checkout isolated Theia experiment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: ide-source
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact toolchain dependencies
        run: npm ci --no-audit --no-fund
      - name: Run YAML AST / CST regression tests
        run: npm test
      - name: Check Procedure Designer TypeScript
        run: npm run typecheck
      - name: Bundle browser site
        run: npm run build
      - name: Chromium E2E — establish-pdu-session Route paths
        run: node scripts/edge-smoke.mjs
      - name: Check static site and asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path("dist/index.html").read_text(encoding="utf-8")
          assert html.lstrip().lower().startswith("<!doctype html>")
          HTMLParser().feed(html)
          for asset in ("./studio.css", "./light.css", "./app.css", "./app.js",
                        "./editor.worker.js", "./yaml.worker.js",
                        "./LICENSE.monaco.txt",
                        "./ThirdPartyNotices.monaco.txt",
                        "./samples/establish-pdu-session.procedure.yaml",
                        "./samples/packages/establish-pdu-session/SKILL.md",
                        "./samples/packages/establish-pdu-session/assurance/contract.yaml",
                        "./samples/packages/establish-pdu-session/assurance/procedure.yaml",
                        "./samples/packages/establish-pdu-session/assurance/predicates.yaml",
                        "./samples/packages/establish-pdu-session/references/3gpp-procedure.md",
                        "./samples/packages/establish-pdu-session/references/session-selection.md",
                        "./samples/packages/establish-pdu-session/references/failure-handling.md",
                        "./samples/packages/establish-pdu-session/scripts/evaluate_udm_read.py",
                        "./samples/packages/establish-pdu-session/schemas/establishment-request.schema.yaml"):
              assert Path("dist", asset.removeprefix("./")).is_file(), asset
          # Legacy fixture sources remain under site/ for tests only, not in published dist/.
          for legacy in ("samples/ensure-pdu-session.procedure.yaml",
                         "samples/packages/ensure-pdu-session"):
              assert not Path("dist", legacy).exists(), legacy
          assert 'src="./app.js"' in html
          assert 'href="./studio.css"' in html
          assert 'href="./light.css"' in html
          assert 'href="./app.css"' in html
          assert not re.search(r'<script[^>]+src=["\']https?://', html, re.I)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check site/app.mjs
          node --check site/source-editor-adapter.mjs
          node --check site/monaco-source-backend.mjs
          node --check site/monaco-language.mjs
          node --check site/yaml-owner-schemas.mjs
          node --check site/yaml-schema-policy.mjs
          node --check site/graph.mjs
          node --check site/graph-scale.mjs
          node --check site/node-designer.mjs
          node --check site/node-create.mjs
          node --check site/node-delete.mjs
          node --check site/node-attributes.mjs
          node --check site/package-audit.mjs
          node --check site/phase-consumer-contract.mjs
          node --check site/phase-evidence-copy.mjs
          node --check tests/phase-evidence-copy.test.mjs
          node --check site/phase-step-order.mjs
          node --check site/phase-step-structural.mjs
          node --check site/phase-step-rename.mjs
          node --check site/phase-named-verify.mjs
          node --check site/phase-step-impact.mjs
          node --check site/phase-routes.mjs
          node --check site/phase-outcomes.mjs
          node --check site/patch.mjs
          node --check site/semantic.mjs
          node --check site/workspace.mjs
          node --check site/layout.mjs
          node --check site/workbench.mjs
          node --check site/sample-packages.mjs
          node --check site/directory-import.mjs
          node --check site/directory-save.mjs
          node --check scripts/e4-native-fixture.mjs
          node --check scripts/e4-native-accept.mjs
          node --check scripts/e4-native-accept-browser.mjs
          node --check tests/e4-native-fixture.test.mjs
          node --check tests/directory-save.test.mjs
          node --check tests/directory-import.test.mjs
          node --check site/zip.mjs
          node --check site/attribute-patch.mjs
          node --check site/highlight.mjs
          node --check site/extended-attributes.mjs
          node --check site/markdown-preview.mjs
          node --check site/view-policy.mjs
          node --check site/visual-route-edit.mjs
          node --check site/react-flow-projection.mjs
          node --check site/file-icons.mjs
          node --check tests/file-icons.test.mjs
          node --check tests/react-flow-migration.test.mjs
          node --check tests/visual-route-edit.test.mjs
          node --check tests/navigation-menu.test.mjs
          node --check tests/nested-procedure.test.mjs
          node --check tests/markdown-preview.test.mjs
          node --check tests/view-policy.test.mjs
          node --check tests/highlight.test.mjs
          node --check tests/extended-attributes.test.mjs
          node --check tests/package.test.mjs
          node --check tests/attributes.test.mjs
          node --check tests/graph-scale.test.mjs
          node --check tests/node-designer.test.mjs
          node --check tests/node-create.test.mjs
          node --check tests/node-delete.test.mjs
          node --check tests/node-attributes.test.mjs
          node --check tests/package-audit.test.mjs
          node --check tests/phase-consumer-contract.test.mjs
          node --check tests/phase-step-order.test.mjs
          node --check tests/phase-step-structural.test.mjs
          node --check tests/phase-step-rename.test.mjs
          node --check tests/phase-named-verify.test.mjs
          node --check tests/phase-step-impact.test.mjs
          node --check tests/phase-routes.test.mjs
          node --check tests/phase-outcomes.test.mjs
          node --check tests/source-editor-adapter.test.mjs
          node --check tests/monaco-language.test.mjs
          node --check tests/yaml-owner-schemas.test.mjs
          node --check tests/graph.test.mjs
          node --check tests/patch.test.mjs
          node --check tests/workspace.test.mjs
          node --check tests/layout.test.mjs
          node --check tests/workbench.test.mjs
          node --check tests/journey.test.mjs
          node --check scripts/build.mjs
          node --check scripts/edge-smoke.mjs
          node --check scripts/d1-interaction-smoke.mjs
      - name: Build Theia Web extension for default online workbench
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        run: |
          npm ci --no-audit --no-fund
          node experiments/ide-host/scripts/build-ide-spike.mjs
          node experiments/ide-host/scripts/prepare-theia-online.mjs
          node --test experiments/ide-host/tests/pages-compose.test.mjs
      - name: Build Theia browser-only static workbench
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        run: |
          npm install --prefix experiments/ide-host/theia-online --no-audit --no-fund --ignore-scripts
          npm run build --prefix experiments/ide-host/theia-online
          node experiments/ide-host/scripts/prepare-theia-static-preview.mjs
      - name: Real Chromium acceptance at the default Pages root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo"
          THEIA_REQUIRE_WEBVIEW: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      # Theia is the default online host. The previous full-featured browser
      # Studio is copied intact to /classic/ before the root is replaced.
      - name: Compose default Theia root and preserve Classic Studio
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: main-source
        run: |
          node ../ide-source/experiments/ide-host/scripts/compose-pages-release.mjs --classic dist --theia ../ide-source/experiments/ide-host/theia-online/lib/frontend --output dist
          test -s dist/index.html
          test -s dist/bundle.js
          test -s dist/hostedPlugin/list.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/package.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/themes/skill-studio-light-color-theme.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/icons/skill-studio-file-icon-theme.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/icons/skill.svg
          test -s dist/webview/index.html
          test -s dist/classic/index.html
          test -s dist/classic/app.js
          test -s dist/classic/samples/packages/establish-pdu-session/assurance/procedure.yaml
          test -s dist/ide-preview/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: main-source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages is published from main only. Experiment and theme branches
    # retain CI/build artifacts but cannot overwrite the public site.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Single protected deployment environment for the main branch.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4
