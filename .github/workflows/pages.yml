name: Deploy Skill Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact toolchain dependencies
        run: npm ci --no-audit --no-fund
      - name: Run YAML AST / CST regression tests
        run: npm test
      - name: Bundle browser site
        run: npm run build
      - name: Check static site and asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path("dist/index.html").read_text(encoding="utf-8")
          assert html.lstrip().lower().startswith("<!doctype html>")
          HTMLParser().feed(html)
          for asset in ("./studio.css", "./app.js", "./samples/ensure-pdu-session.procedure.yaml"):
              assert Path("dist", asset.removeprefix("./")).is_file(), asset
          assert 'src="./app.js"' in html
          assert 'href="./studio.css"' in html
          assert not re.search(r'<script[^>]+src=["\']https?://', html, re.I)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check site/app.mjs
          node --check site/graph.mjs
          node --check site/patch.mjs
          node --check site/semantic.mjs
          node --check tests/graph.test.mjs
          node --check tests/patch.test.mjs
          node --check scripts/build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4
