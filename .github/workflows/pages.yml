name: Deploy Skill Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "experiments/ide-host/**"
      - "extensions/skill-studio-theme/**"
      - "extensions/skill-studio-languages/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-source
    steps:
      - name: Checkout current published site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Checkout isolated Theia experiment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: ide-source
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact toolchain dependencies
        run: npm ci --no-audit --no-fund
      - name: Run YAML AST / CST regression tests
        run: npm test
      - name: Check Procedure Designer TypeScript
        run: npm run typecheck
      - name: Check tracked active JavaScript syntax
        shell: bash
        run: |
          # Check the active source inventory rather than a stale hardcoded list.
          # Retired language-model tests remain archived, not executable gates.
          checked=0
          while IFS= read -r -d '' file; do
            case "$file" in
              site/*.mjs|scripts/*.mjs|tests/*.test.mjs|experiments/ide-host/scripts/*.mjs) ;;
              *) continue ;;
            esac
            case "$file" in
              *.retired.mjs|tests/retired-language-model/*) continue ;;
            esac
            node --check "$file"
            checked=$((checked+1))
          done < <(git ls-files -z -- site scripts tests experiments/ide-host/scripts)
          test "$checked" -gt 0
          echo "Checked $checked active tracked JavaScript files"
      - name: Build Theia Web extension for default online workbench
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        run: |
          npm ci --no-audit --no-fund
          # Browser LSP has two separately locked dependency roots. Without
          # these installs, the Pages Worker bundle cannot resolve the LSP SDK.
          npm ci --prefix experiments/ide-host/lsp-browser/client --omit=dev --no-audit --no-fund
          npm ci --prefix experiments/ide-host/lsp-browser/server --no-audit --no-fund
          node experiments/ide-host/scripts/build-ide-spike.mjs
      - name: Checkout pinned CA Skill Compiler v2.0.0 source
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        uses: actions/checkout@v4
        with:
          repository: odango-chan/ca-skill-compiler
          ref: v2.0.0
          path: compiler-source
          token: ${{ secrets.CA_SKILL_COMPILER_READ_TOKEN }}
          persist-credentials: false
      - name: Go 1.26.6 for the pinned Compiler WASM build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Build pinned Compiler v2.0.0 Go/WASM Core
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: compiler-source
        run: |
          mkdir -p dist
          GOWORK=off CGO_ENABLED=0 GOOS=js GOARCH=wasm go build -o dist/skillc.wasm ./cmd/skillc-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/wasm_exec.js
          cp dist/skillc.wasm ../ide-source/experiments/ide-host/vscode/dist/skillc.wasm
          cp dist/wasm_exec.js ../ide-source/experiments/ide-host/vscode/dist/wasm_exec.js
          sha256sum dist/skillc.wasm
      - name: Stage prepared Compiler Worker and WASM assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        run: |
          node experiments/ide-host/scripts/prepare-theia-online.mjs
          node --test experiments/ide-host/tests/pages-compose.test.mjs
      - name: Build Theia browser-only static workbench
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        run: |
          npm install --prefix experiments/ide-host/theia-online --no-audit --no-fund --ignore-scripts
          node experiments/ide-host/scripts/link-fixed-workbench-core.mjs experiments/ide-host/theia-online
          npm run build:fixed-workbench --prefix experiments/ide-host/theia-online
          # Fetch the pinned native Markdown language-features VSIX declared by
          # the Theia app before building the frontend. The Pages build consumes
          # its unpacked extension assets when preparing the static Preview.
          npm run download:plugins --prefix experiments/ide-host/theia-online
          npm run build --prefix experiments/ide-host/theia-online
          node experiments/ide-host/scripts/prepare-theia-static-preview.mjs
          node experiments/ide-host/scripts/prepare-theia-brand.mjs experiments/ide-host/theia-online/lib/frontend
      - name: Real Chromium acceptance at the default Pages root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: ide-source
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo"
          THEIA_REQUIRE_WEBVIEW: "1"
          THEIA_REQUIRE_BROWSER_LSP: "1"
          THEIA_REQUIRE_COMPILER_WORKER: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      # Theia is the only supported online host. Publish no Classic fallback.
      - name: Compose Theia-only Pages release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: main-source
        run: |
          node ../ide-source/experiments/ide-host/scripts/compose-pages-release.mjs --theia ../ide-source/experiments/ide-host/theia-online/lib/frontend --output dist --site-root .
          test -s dist/index.html
          test -s dist/bundle.js
          test -s dist/hostedPlugin/list.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/package.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/themes/skill-studio-light-color-theme.json
          test -s dist/hostedPlugin/odango_chan_skill_studio_theme/icons/skill-studio-file-icon-theme.json
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/grammars/yaml/syntaxes/yaml.tmLanguage.json
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/grammars/python/syntaxes/MagicPython.tmLanguage.json
          test -s dist/webview/index.html
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/skill-language-server.js
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/compiler-worker.js
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/skillc.wasm
          test -s dist/hostedPlugin/odango_chan_ca_skill_studio_ide_spike/dist/wasm_exec.js
          test ! -e dist/classic
          test ! -e dist/app.js
          test ! -e dist/ide-preview
          test ! -e dist/classic-icons.css
      - name: Record and verify exact deployed source identity
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spike/ide-extension-theia-host'
        working-directory: main-source
        run: node ../ide-source/experiments/ide-host/scripts/write-pages-build-info.mjs --source ../ide-source --output dist/build-info.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: main-source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages is published from main only. Experiment and theme branches
    # retain CI/build artifacts but cannot overwrite the public site.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Single protected deployment environment for the main branch.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4
