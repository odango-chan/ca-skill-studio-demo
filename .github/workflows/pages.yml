name: Deploy Skill Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check static preview exists
        run: |
          test -s site/index.html
          grep -q 'Skill Studio' site/index.html
      - name: Validate HTML and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("site/index.html").read_text(encoding="utf-8")
          HTMLParser().feed(source)
          assert source.lstrip().lower().startswith("<!doctype html>")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          assert len(scripts) == 1, "Expected exactly one embedded JavaScript block"
          Path("/tmp/skill-studio-pages.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/skill-studio-pages.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4
