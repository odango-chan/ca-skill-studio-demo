name: Verify Theia Browser Host Source + Preview
# Browser acceptance asserts native YAML and Python TextMate tokenization without LSP.

on:
  pull_request:
    paths:
      - "experiments/ide-host/**"
      - "extensions/skill-studio-theme/**"
      - "extensions/skill-studio-languages/**"
      - ".github/workflows/theia-browser-host-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theia-browser-host:
    # Theia 1.76's native keytar dependency is validated on the stable LTS runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      THEIA_WEBVIEW_EXTERNAL_ENDPOINT: "{{hostname}}"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Linux native keytar prerequisites
        # Limit runner DNS/mirror stalls without treating missing native
        # dependencies as a passing browser-acceptance test.
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists libsecret-1; then
            echo "KEYTAR_NATIVE_PREREQUISITE_PRESENT"
            exit 0
          fi
          echo "::notice title=Keytar prerequisites::Installing missing libsecret-1 development files with bounded apt attempts"
          apt_opts=(
            -o Acquire::Retries=1
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=12
            -o Acquire::https::Timeout=12
          )
          for attempt in 1 2; do
            echo "KEYTAR_APT_INSTALL_ATTEMPT=$attempt"
            if timeout -k 5s 50s sudo apt-get "${apt_opts[@]}" update &&
               timeout -k 5s 90s sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends libsecret-1-dev; then
              if pkg-config --exists libsecret-1; then
                echo "KEYTAR_NATIVE_PREREQUISITE_READY"
                exit 0
              fi
              echo "::error title=Missing native prerequisite::apt completed but pkg-config cannot resolve libsecret-1"
              exit 1
            fi
            if [ "$attempt" -lt 2 ]; then sleep 5; fi
          done
          echo "::error title=Keytar prerequisite installation failed::Could not install libsecret-1-dev after bounded apt attempts. This is a runner prerequisite failure, not a Theia browser acceptance result."
          exit 1
      - name: Install pinned Studio dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser LSP client and server dependencies
        run: |
          npm ci --prefix experiments/ide-host/lsp-browser/client --omit=dev --no-audit --no-fund
          npm ci --prefix experiments/ide-host/lsp-browser/server --no-audit --no-fund
      - name: Build shared Procedure extension and webview
        run: node experiments/ide-host/scripts/build-ide-spike.mjs
      - name: Checkout pinned CA Skill Compiler v2.1.0 source
        uses: actions/checkout@v4
        with:
          repository: odango-chan/ca-skill-compiler
          ref: b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65
          path: compiler-source
          token: ${{ secrets.CA_SKILL_COMPILER_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned CA Skill Compiler v2.1.0 source identity
        working-directory: compiler-source
        run: |
          test "$(git rev-parse HEAD)" = "b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65"
          grep -F 'const CompilerVersion = "v2.1.0"' internal/compiler/version.go
      - name: Download and verify official Compiler v2.1.0 Worker bundle
        working-directory: compiler-source
        run: |
          set -euo pipefail
          mkdir -p dist ../experiments/ide-host/vscode/dist
          release="https://github.com/odango-chan/ca-skill-compiler/releases/download/v2.1.0"
          curl -fsSL "$release/SHA256SUMS" -o dist/SHA256SUMS
          curl -fsSL "$release/skillc-v2.1.0-web-worker.tar.gz" -o dist/skillc-v2.1.0-web-worker.tar.gz
          (cd dist && grep -F "skillc-v2.1.0-web-worker.tar.gz" SHA256SUMS | sha256sum --check)
          tar -xzf dist/skillc-v2.1.0-web-worker.tar.gz -C dist
          test -s dist/skillc.wasm
          test -s dist/wasm_exec.js
          cp dist/skillc.wasm ../experiments/ide-host/vscode/dist/skillc.wasm
          cp dist/wasm_exec.js ../experiments/ide-host/vscode/dist/wasm_exec.js
          cp web/parity-v1alpha5/trusted-build-request.json ../experiments/ide-host/vscode/dist/authoring-trusted-build-request.json
          cp docs/design/fixtures/registration-development-request.json ../experiments/ide-host/vscode/dist/authoring-development-build-request.json
      - name: Stage same Web extension for Theia
        run: node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Stage same Web extension for Theia
        run: node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Install isolated Theia 1.76 browser app
        run: npm install --prefix experiments/ide-host/theia-browser --no-audit --no-fund
      - name: Link fixed workbench to the app's exact Theia core
        run: node experiments/ide-host/scripts/link-fixed-workbench-core.mjs experiments/ide-host/theia-browser
      - name: Compile fixed Preview shell contribution
        run: npm run build:fixed-workbench --prefix experiments/ide-host/theia-browser
      - name: Download pinned built-in Markdown extension from Open VSX
        run: npm run download:plugins --prefix experiments/ide-host/theia-browser
      - name: Build normal Theia browser app with backend
        run: npm run build --prefix experiments/ide-host/theia-browser
      - name: Apply SKILL Studio menu branding
        run: node experiments/ide-host/scripts/prepare-theia-brand.mjs experiments/ide-host/theia-browser/lib/frontend
      - name: Deploy prepared Web extension to Theia backend plugin directory
        run: |
          mkdir -p "$HOME/.theia/plugins"
          cp -R experiments/ide-host/theia-online/plugins/odango-chan.ca-skill-studio-ide-spike "$HOME/.theia/plugins/"
          test -s "$HOME/.theia/plugins/odango-chan.ca-skill-studio-ide-spike/package.json"
          cp -R experiments/ide-host/theia-online/plugins/odango-chan.skill-studio-theme "$HOME/.theia/plugins/"
          test -s "$HOME/.theia/plugins/odango-chan.skill-studio-theme/package.json"
          test -s "$HOME/.theia/plugins/odango-chan.ca-skill-studio-ide-spike/dist/grammars/yaml/syntaxes/yaml.tmLanguage.json"
          test -s "$HOME/.theia/plugins/odango-chan.ca-skill-studio-ide-spike/dist/grammars/python/syntaxes/MagicPython.tmLanguage.json"
          markdown_manifest=$(find experiments/ide-host/theia-online/plugins -mindepth 2 -maxdepth 5 -type f -name package.json -print | while IFS= read -r file; do grep -q '"name"[[:space:]]*:[[:space:]]*"markdown-language-features"' "$file" && { echo "$file"; break; }; done)
          test -n "$markdown_manifest"
          cp -R "$(dirname "$markdown_manifest")" "$HOME/.theia/plugins/"
      - name: Start Theia backend for Webview endpoint
        env:
          THEIA_ACCEPTANCE_FIXTURES: "1"
        run: |
          npm run start --prefix experiments/ide-host/theia-browser > /tmp/theia-browser.log 2>&1 &
          echo $! > /tmp/theia-browser.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "THEIA_BROWSER_BACKEND_READY"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/theia-browser.pid)" 2>/dev/null; then
              cat /tmp/theia-browser.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/theia-browser.log
          exit 1
      - name: Real Chromium import, single Source group, right Preview Host and React Flow graph
        env:
          THEIA_URL: "http://127.0.0.1:3000/"
          THEIA_ACCEPTANCE_FIXTURES: "1"
          THEIA_REQUIRE_COMPILER_WORKER: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      - name: Upload Theia backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theia-browser-host-failure-log
          path: /tmp/theia-browser.log
          if-no-files-found: ignore
          retention-days: 7
