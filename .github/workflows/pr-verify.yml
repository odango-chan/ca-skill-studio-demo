name: Verify Skill Studio pull requests
on:
  pull_request:
    paths:
      - 'authoring/**'
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - 'tests/**'
      - 'extensions/skill-studio-languages/**'
      - 'extensions/skill-studio-theme/**'
      - 'language/**'
      - 'experiments/ide-host/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Syntax-check opt-in live Gateway smoke without credentials
        run: node --check experiments/ide-host/scripts/ai-authoring-live-gateway-smoke.mjs
      - name: Package self-contained Windows Authoring Core live-model smoke
        run: |
          mkdir -p dist/ai-authoring-live-smoke-windows
          ./node_modules/.bin/esbuild experiments/ide-host/scripts/ai-authoring-live-gateway-smoke.mjs \
            --bundle --platform=node --format=esm --target=node24 \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --outfile=dist/ai-authoring-live-smoke-windows/ai-authoring-live-gateway-smoke.mjs
          cp experiments/ide-host/scripts/run-ai-authoring-live-gateway-windows.cmd \
            dist/ai-authoring-live-smoke-windows/run-live-gateway-smoke.cmd
          cp docs/testing/ai-authoring-live-gateway.md \
            dist/ai-authoring-live-smoke-windows/README.md
          node --check dist/ai-authoring-live-smoke-windows/ai-authoring-live-gateway-smoke.mjs
      - name: Prove portable smoke against synthetic Gateway with real Authoring Core
        run: node --test experiments/ide-host/acceptance/ai-authoring-live-bundle.test.mjs
      - name: Upload opt-in Windows Authoring Core smoke without credentials
        uses: actions/upload-artifact@v4
        with:
          name: studio-ai-authoring-live-smoke-windows
          path: dist/ai-authoring-live-smoke-windows/
          retention-days: 7
          if-no-files-found: error
      - name: Plugin-managed project and Package Explorer tests
        run: npm run test:plugin-managed
      - run: npm run typecheck
      - name: Install pinned browser LSP client and server dependencies
        run: |
          npm ci --prefix experiments/ide-host/lsp-browser/client --omit=dev --no-audit --no-fund
          npm ci --prefix experiments/ide-host/lsp-browser/server --no-audit --no-fund
      - name: Build IDE host extensions
        run: node experiments/ide-host/scripts/build-ide-spike.mjs
      - name: Checkout pinned CA Skill Compiler v2.1.0 source
        uses: actions/checkout@v4
        with:
          repository: odango-chan/ca-skill-compiler
          ref: b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65
          path: compiler-source
          token: ${{ secrets.CA_SKILL_COMPILER_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned CA Skill Compiler v2.1.0 source identity
        working-directory: compiler-source
        run: |
          test "$(git rev-parse HEAD)" = "b67fbb56c34d15b8d5a0903c8a7ca93d608f8f65"
          grep -F 'const CompilerVersion = "v2.1.0"' internal/compiler/version.go
      - name: Download and verify official Compiler v2.1.0 Worker bundle
        working-directory: compiler-source
        run: |
          set -euo pipefail
          mkdir -p dist ../experiments/ide-host/vscode/dist
          release="https://github.com/odango-chan/ca-skill-compiler/releases/download/v2.1.0"
          curl -fsSL "$release/SHA256SUMS" -o dist/SHA256SUMS
          curl -fsSL "$release/skillc-v2.1.0-web-worker.tar.gz" -o dist/skillc-v2.1.0-web-worker.tar.gz
          (cd dist && grep -F "skillc-v2.1.0-web-worker.tar.gz" SHA256SUMS | sha256sum --check)
          tar -xzf dist/skillc-v2.1.0-web-worker.tar.gz -C dist
          test -s dist/skillc.wasm
          test -s dist/wasm_exec.js
          cp dist/skillc.wasm ../experiments/ide-host/vscode/dist/skillc.wasm
          cp dist/wasm_exec.js ../experiments/ide-host/vscode/dist/wasm_exec.js
          cp docs/design/fixtures/registration-development-request.json ../experiments/ide-host/vscode/dist/authoring-development-build-request.json
      - name: Verify Compiler v2.1.0 Development Build and Verify through Node Worker
        run: node experiments/ide-host/scripts/compiler-development-acceptance.mjs compiler-source
      - name: Verify frozen v1alpha5 artifact generator regression
        run: node experiments/ide-host/scripts/ai-authoring-compiler-acceptance.mjs compiler-source

  portable-windows-smoke:
    name: Native Windows standalone Authoring smoke
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: studio-ai-authoring-live-smoke-windows
          path: dist/ai-authoring-live-smoke-windows
      - name: Verify the actual downloaded artifact on Windows with synthetic Provider
        shell: pwsh
        run: |
          node --check dist/ai-authoring-live-smoke-windows/ai-authoring-live-gateway-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows smoke script has invalid syntax' }
          node --test experiments/ide-host/acceptance/ai-authoring-live-bundle.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows bundled Authoring Core acceptance failed' }
          if (-not (Test-Path dist/ai-authoring-live-smoke-windows/run-live-gateway-smoke.cmd)) {
            throw 'Missing native Windows launcher'
          }
