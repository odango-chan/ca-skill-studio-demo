name: Deploy temporary Theia Pages preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: skill-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout current published site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Checkout isolated Theia experiment
        uses: actions/checkout@v4
        with:
          ref: spike/ide-extension-theia-host
          path: ide-source
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify existing Pages app from main
        working-directory: main-source
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Build shared SKILL Studio Web extension
        working-directory: ide-source
        run: |
          npm ci --no-audit --no-fund
          node experiments/ide-host/scripts/build-ide-spike.mjs
          node experiments/ide-host/scripts/prepare-theia-online.mjs
      - name: Build Theia browser-only app
        working-directory: ide-source
        run: |
          npm install --prefix experiments/ide-host/theia-online --no-audit --no-fund --ignore-scripts
          npm run build --prefix experiments/ide-host/theia-online
          node experiments/ide-host/scripts/prepare-theia-static-preview.mjs
      - name: Real Chromium acceptance at the Pages subpath
        working-directory: ide-source
        env:
          THEIA_BASE_PATH: "/ca-skill-studio-demo/ide-preview"
          THEIA_REQUIRE_WEBVIEW: "1"
        run: node experiments/ide-host/scripts/theia-browser-smoke.mjs
      - name: Compose preview without replacing existing site root
        run: |
          mkdir -p main-source/dist/ide-preview
          cp -R ide-source/experiments/ide-host/theia-online/lib/frontend/. main-source/dist/ide-preview/
          test -s main-source/dist/ide-preview/index.html
          test -s main-source/dist/ide-preview/webview/index.html
          test -s main-source/dist/ide-preview/hostedPlugin/list.json
          cat > main-source/dist/ide-preview/preview-meta.json <<'EOF'
          {
            "kind": "temporary-demo-preview",
            "sourceBranch": "spike/ide-extension-theia-host",
            "warning": "Same-origin webviews are enabled for this static demo only. Do not open sensitive workspaces."
          }
          EOF
          test -s main-source/dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: main-source/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/spike/ide-extension-theia-host'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy temporary preview path
        id: deployment
        uses: actions/deploy-pages@v4
