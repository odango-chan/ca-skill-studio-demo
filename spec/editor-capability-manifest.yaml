apiVersion: skillstudio.demo/v1alpha1
kind: EditorCapabilityManifest
metadata:
  name: ca-skill-studio-demo
  status: observed-runtime-asset-baseline
  generatedAt: "2026-10-31"
  source:
    repository: odango-chan/ca-agent-demo
    commit: bf445ad777149af5af2dfa0a5bdea18d0451303e
    tree: 89f45b85e025c2a18952495abcf269e99ddb400e
    evidence:
      skillContextLoader: src/ca_agent_demo/agent/host/skill_context.py
      hostAdmission: src/ca_agent_demo/runtime/admission.py
      exactEntryLinker: src/ca_agent_demo/runtime/linker.py
      predicateEngine: src/ca_agent_demo/runtime/predicate_engine.py
      governedScriptBackend: src/ca_agent_demo/runtime/governed_script.py
      assetRoot: src/ca_agent_demo/support/assets.py
    localSchemaSnapshot: tests/contracts/ca-skill-toolchain/03a42764ee2a67e39f57ab550b63c7a5d7966199
    authoringValidator: scripts/validate_docs.py
    localGate: make verify
  scope:
    product: runtime-and-model-context-skill-authoring
    compatibilityTarget: ca-agent-demo-pinned-baseline
    externalToolchainDependency: false
    runtimeAuthority: false

evidenceLevels:
  model-context-consumed: "Loaded into model context by the Host SkillContextLoader."
  runtime-consumed: "Read, frozen, validated, or executed by Host / Runtime code in the pinned source path."
  contract-declared: "Referenced by a runtime-consumed contract, but direct runtime loading was not confirmed."
  host-external: "Consumed by Host / Runtime but located outside the Skill Package."
  loader-supported-not-observed: "The Host supports this loading mode, but no current pinned Skill Package uses it."
  schema-declared: "Declared by the pinned Demo Schema snapshot."
  demo-custom-validated: "Checked by a repository-local specialized validator."
  not-runtime-consumed: "Not loaded into model context or consumed by the current Host / Runtime path."

editorBehaviors:
  editable: "Structured editing is supported and round-trip safety is tested."
  source-only: "Raw source can be edited; no structured editor is promised."
  preserve-only: "Unknown or unsupported syntax must be retained without semantic editing."
  opaque-preserve: "Not surfaced as a first-class editor asset; preserve bytes and include in complete Package operations."
  unavailable: "Not supported by the current adapter."

runtimeConsumption:
  modelContext:
    - path: SKILL.md
      evidence: model-context-consumed
      consumer: SkillContextLoader.load_skill
      behavior: full-markdown-loaded
      editor: markdown-source-preview
    - path: references/preload/**
      evidence: loader-supported-not-observed
      consumer: SkillContextLoader.load_skill
      behavior: auto-load-all-files-after-skill-selection
      editor: markdown-reference-editor
    - path: references/on-demand/**
      evidence: loader-supported-not-observed
      consumer: SkillContextLoader.read_reference
      behavior: exact-path-only-and-path-must-be-named-in-loaded-SKILL.md
      editor: markdown-reference-editor
    - path: references/samples/**
      evidence: loader-supported-not-observed
      consumer: SkillContextLoader.read_reference
      behavior: explicit-exact-path-only-never-auto-load
      editor: markdown-reference-editor
  machineExecution:
    - path: assurance/contract.yaml
      evidence: runtime-consumed
      consumer: load_admitted_closure; admit_skill_entry; compile_link_admit_skill_entry
      behavior: skill-type-entry-dependencies-required-facts-postconditions
      editor: contract-source-and-inspector
    - path: assurance/procedure.yaml
      evidence: runtime-consumed
      consumer: load_admitted_closure; compile_link_admit_skill_entry; _freeze_procedure_graph
      behavior: exact-entry-procedure-and-child-procedure-source
      editor: procedure-designer
    - path: assurance/predicates.yaml
      evidence: runtime-consumed
      consumer: load_admitted_closure; linker; PredicateEngine
      behavior: frozen-observation-scope-freshness-cel-and-script-evaluator-definitions
      editor: predicate-source-and-inspector
    - path: scripts/select_establishment_configuration.py
      evidence: runtime-consumed
      consumer: GovernedCreatedSessionScriptBackend.execute
      behavior: exact-script-allowlist-and-schema-validated-local-compute
      editor: python-source-editor
    - path: scripts/evaluate_udm_read.py
      evidence: runtime-consumed
      consumer: GovernedCreatedSessionScriptBackend.execute_predicate
      behavior: exact-script-allowlist-and-schema-validated-predicate-evaluation
      editor: python-source-editor
    - path: scripts/evaluate_transfer_start.py
      evidence: runtime-consumed
      consumer: GovernedCreatedSessionScriptBackend.execute_predicate
      behavior: exact-script-allowlist-and-schema-validated-predicate-evaluation
      editor: python-source-editor
  schemas:
    runtime-loaded:
      - selection-input.schema.yaml
      - selection.schema.yaml
      - udm-read-evaluation-input.schema.yaml
      - transfer-start-evaluation-input.schema.yaml
      - predicate-evaluation-result.schema.yaml
    contract-declared-not-runtime-confirmed:
      - establishment-request.schema.yaml
  hostExternal:
    - path: planning/skill-surfaces/5gc-file-transfer.yaml
      evidence: host-external
      consumer: load_root_sources
      behavior: root-local-procedure-allowlist
      editor: read-only-external-dependency

packageInventory:
  skills:
    - name: 5gc-intent
      role: routing-policy
      runtimeAssets: [SKILL.md]
      status: observed
    - name: 5gc-file-transfer
      role: root-business-skill
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml, schemas, scripts]
      status: observed
    - name: ue-registration
      role: registration-convergence
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml]
      status: observed
    - name: ensure-pdu-session
      role: pdu-session-target-convergence
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml]
      status: observed
    - name: ensure-session-qos
      role: session-qos-convergence
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml]
      status: observed
    - name: ensure-virtual-group
      role: virtual-group-lifecycle-convergence
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml]
      status: observed
    - name: establish-pdu-session
      role: source-first-createdsession-candidate
      runtimeAssets: [SKILL.md, assurance/contract.yaml, assurance/procedure.yaml, assurance/predicates.yaml, schemas, scripts]
      runtimeCompatible: false
      activeInRouting: false
      status: observed-transitional

packageShape:
  required:
    - SKILL.md
  commonExecutableAssets:
    - assurance/contract.yaml
    - assurance/procedure.yaml
    - assurance/predicates.yaml
  optionalRuntimeOrContextAssets:
    - references/
    - schemas/
    - scripts/
  notSurfacedAsRuntimeAssets:
    behavior: opaque-preserve
    identityDigest: included-in-complete-package-artifact-digest

artifactIdentity:
  hostSkillArtifactDigest:
    source:
      - SkillContextLoader._artifact_digest
      - local_root_skill_identity
    includes: every-file-under-the-selected-Skill-root
  modelContextDigest:
    source: SkillContextLoader._digest
    includes:
      - SKILL.md
      - references/preload files actually loaded
  admittedExecutableClosureDigest:
    source: load_admitted_closure
    includes:
      - assurance/contract.yaml
      - assurance/procedure.yaml
      - assurance/predicates.yaml
    canonicalization: parsed-YAML-mapping
  invariant: digest-domain-membership-is-not-runtime-consumption

yamlCompatibility:
  implementationObserved:
    library: PyYAML
    loader: SafeLoader-with-custom-bool-resolver
    booleanValues: [true, false]
    unquotedOnKey: string
    roundTripCommentsPreservedByDemoLoader: false
  editorRequirement:
    useRoundTripParserForEditing: true
    preserveCommentsAndOrder: true
    preserveUnknownFields: true
    validateSavedOutputWithDemoLoader: true

procedure:
  sourceEnvelope:
    topLevel: procedures
    procedureFieldsObservedOrDeclared: [applicability, inputs, start, nodes]
  nodeConstructs:
    - id: call
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-roundtrip-poc
    - id: verify
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-roundtrip-poc
    - id: script
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-step-model-verified
    - id: procedure
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-composition-semantics-verified
    - id: terminal
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-roundtrip-poc
    - id: reconcile
      evidence: schema-declared
      initialEditorBehavior: source-only
    - id: tool
      evidence: schema-declared
      initialEditorBehavior: source-only
    - id: predicate
      evidence: schema-declared
      initialEditorBehavior: source-only
    - id: for
      evidence: schema-declared
      initialEditorBehavior: source-only
  commonFields:
    - id: with-from
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-binding-model
    - id: on
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-route-model
    - id: inputs
      evidence: runtime-consumed
      initialEditorBehavior: source-only-until-roundtrip-poc
    - id: applicability
      evidence: schema-declared
      initialEditorBehavior: source-only
  transitionalExtensions:
    - id: node-preconditions
      evidence: demo-custom-validated
      appliesTo: establish-pdu-session
      sourceShape: preconditions.steps + preconditions.on
      currentStepOperators: [script, call, verify, procedure]
      currentAllowedCalls:
        - ca.session.operation_context.read
        - ca.session.pcf_create_inputs.read
        - ca.session.establishment_response.prepare
      currentAllowedScripts:
        - scripts/select_establishment_configuration.py
      currentAllowedProcedures:
        - await-ue-session-configuration
      routeOutcomes: [FAILED, UNRESOLVED]
      runtimeCompatible: false
      initialEditorBehavior: source-only-until-dedicated-profile-tests-pass
    - id: node-postconditions
      evidence: demo-custom-validated
      appliesTo: establish-pdu-session
      sourceShape: postconditions.steps + postconditions.on
      currentStepOperators: [verify]
      routeOutcomes: [PASS, FAIL, UNKNOWN]
      runtimeCompatible: false
      initialEditorBehavior: source-only-until-dedicated-profile-tests-pass

contract:
  evidence: runtime-consumed
  fields:
    - apiVersion
    - kind
    - metadata.name
    - spec.skillType
    - spec.goal
    - spec.entryProcedure
    - spec.inputs.requestSchema
    - spec.context.requiredFacts
    - spec.allowedResources.capabilities
    - spec.allowedResources.localTools
    - spec.preconditions
    - spec.requirements
    - spec.postconditions
    - spec.dependencies
    - spec.planning.maxActions
    - spec.planning.allowDynamicProcedure
    - spec.planning.fallbackProcedure
    - spec.planning.budgetPartition
    - spec.failureSemantics.outcomeUnknown.requireReconcile
  initialEditorBehavior: source-first-form-after-schema-tests

predicate:
  evidence: runtime-consumed
  observedEvaluatorTypes: [cel, script]
  observationFields: [ref, scope, freshness, when]
  evaluatorFields:
    cel: [type, expression]
    script: [type, ref]
  initialEditorBehavior: source-first-with-structured-inspector

scriptPolicy:
  evidence: runtime-consumed
  executionRequires:
    - exact-host-script-allowlist
    - input-schema-validation
    - output-schema-validation
  addingFileDoesNotGrantExecution: true
  currentEstablishPduSessionScripts:
    - scripts/select_establishment_configuration.py
    - scripts/evaluate_udm_read.py
    - scripts/evaluate_transfer_start.py

schemaPolicy:
  runtimeLoaded:
    - selection-input.schema.yaml
    - selection.schema.yaml
    - udm-read-evaluation-input.schema.yaml
    - transfer-start-evaluation-input.schema.yaml
    - predicate-evaluation-result.schema.yaml
  contractDeclaredNotRuntimeConfirmed:
    - establishment-request.schema.yaml

referencePolicy:
  preload: host-auto-load-after-skill-selection
  on-demand: exact-path-only-and-path-must-be-named-in-SKILL.md
  samples: explicit-exact-path-only-never-auto-load
  noCurrentPinnedSkillUsesReferences: true

authoringPolicy:
  status: proposed-not-implemented
  sourceAuthority: package-files
  semanticModelAuthority: derived-only
  visualWriteback: typed-source-patch-only
  saveTarget: local-working-copy
  roundTripRequiredBeforeStructuredEdit: true
  failureBehavior: atomic-rollback
  unknownSyntax: preserve-only-or-source-only
  sharedHistory:
    sourceAndVisual: true
    undoRedo: required
  initialProfiles:
    ensure-pdu-session:
      role: first-limited-visual-editing-sample
      status: proposed
      allowedOnlyAfterRoundTripTests:
        - call
        - verify
        - terminal
        - with-from
        - on
    establish-pdu-session:
      role: complex-compatibility-sample
      status: read-and-roundtrip-first
      transitionalNodePhases: source-only-until-dedicated-profile-tests-pass
